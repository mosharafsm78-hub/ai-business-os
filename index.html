<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08110f"><title>Forge — AI Business OS</title><meta name="description" content="Start, launch and grow a business with an AI operating team."><style>
:root{--bg:#07100e;--panel:#0d1815;--panel2:#111f1b;--line:#20312b;--text:#f2f6f3;--muted:#91a39c;--mint:#b9f3d0;--mint2:#6de0a1;--amber:#f2c879;--danger:#ff8f8f;--shadow:0 24px 70px #0008}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(900px 600px at 72% -10%,#17362b 0,transparent 55%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:#07100eea;backdrop-filter:blur(18px);z-index:20}.brand{display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),#63cfa1);display:grid;place-items:center;color:#092019;font-weight:900}.topright{display:flex;align-items:center;gap:12px}.pill{border:1px solid var(--line);background:#0d1915;color:#cfe0d8;border-radius:999px;padding:9px 14px;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#263a33;display:grid;place-items:center;font-weight:700}.layout{display:flex}.side{width:248px;border-right:1px solid var(--line);min-height:calc(100vh - 72px);padding:22px 14px;position:fixed}.navlabel{font-size:11px;color:#61756d;text-transform:uppercase;letter-spacing:.16em;padding:14px 12px 8px}.nav{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:#91a39c;padding:11px 12px;border-radius:10px;text-align:left;margin:2px 0}.nav:hover,.nav.active{background:#14221e;color:#effaf4}.nav.active{box-shadow:inset 2px 0 var(--mint)}.main{margin-left:248px;width:calc(100% - 248px);padding:42px 48px 80px;max-width:1500px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;margin-bottom:30px}.eyebrow{color:var(--mint2);font-size:12px;text-transform:uppercase;letter-spacing:.17em;font-weight:800}.h1{font-size:clamp(34px,5vw,66px);line-height:.98;letter-spacing:-.065em;margin:12px 0 14px;max-width:850px}.sub{color:var(--muted);font-size:17px;line-height:1.6;max-width:720px}.btn{border:1px solid var(--line);background:#14221e;color:#effaf4;border-radius:11px;padding:12px 16px;font-weight:700}.btn.primary{background:var(--mint);color:#082016;border-color:var(--mint)}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(145deg,#0e1a16,#0b1512);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 35px #0002}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.stat{font-size:29px;font-weight:800;letter-spacing:-.04em;margin:10px 0}.label{font-size:12px;color:#73877e}.up{color:var(--mint2);font-size:12px}.section{margin:40px 0 18px;display:flex;align-items:center;justify-content:space-between}.section h2{font-size:21px;margin:0;letter-spacing:-.03em}.section p{color:var(--muted);margin:5px 0 0;font-size:13px}.progress{height:7px;background:#182923;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mint2));border-radius:20px}.biz{display:flex;gap:16px;align-items:center}.bizicon{width:48px;height:48px;border-radius:14px;background:#1a2d26;display:grid;place-items:center;font-size:22px}.mini{font-size:13px;color:var(--muted)}.product{position:relative;overflow:hidden}.product .photo{height:150px;border-radius:12px;background:linear-gradient(135deg,#263b34,#0f1916);display:grid;place-items:center;font-size:55px;margin-bottom:16px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#173228;color:#9ce8bc;font-size:11px;font-weight:800;margin-bottom:8px}.price{font-size:23px;font-weight:800;margin-top:9px}.product h3{margin:4px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.metric{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}.metric b{font-size:16px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line)}.table th{color:#6f827a;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.status{padding:5px 8px;border-radius:999px;background:#183328;color:#9ee6bb;font-size:11px}.chat{display:flex;flex-direction:column;gap:14px;max-width:850px}.bubble{max-width:80%;padding:15px 17px;border-radius:16px;background:#13221d;border:1px solid var(--line);line-height:1.55}.bubble.me{align-self:flex-end;background:#b9f3d0;color:#082016;border-color:#b9f3d0}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;background:#0b1512;border:1px solid var(--line);border-radius:12px;color:white;padding:13px 15px;outline:none}.composer input:focus{border-color:#5fb98b}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d1915}.step b{display:block;margin-bottom:7px}.step span{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:20px}.modal.open{display:grid}.modalbox{max-width:650px;width:100%;background:#0b1713;border:1px solid #2a4138;border-radius:20px;padding:28px;box-shadow:var(--shadow)}.field{margin:16px 0}.field label{display:block;font-size:12px;color:#91a39c;margin-bottom:7px}.field input,.field select{width:100%;background:#07100e;border:1px solid var(--line);color:white;padding:12px;border-radius:10px}.toast{position:fixed;right:22px;bottom:22px;background:#d9ffe8;color:#082016;padding:13px 16px;border-radius:12px;font-weight:700;display:none;z-index:60}.empty{padding:45px;text-align:center;color:var(--muted)}.landing{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:80px 30px}.landing .inner{max-width:1100px;text-align:center}.orb{width:170px;height:170px;border-radius:50%;margin:0 auto 30px;background:radial-gradient(circle at 35% 30%,#d8ffe6,#79d9a7 25%,#1a4837 55%,#0b1713 72%);box-shadow:0 0 100px #7de2ae33}.landing h1{font-size:clamp(48px,8vw,100px);letter-spacing:-.08em;line-height:.9;margin:0}.landing p{max-width:720px;margin:25px auto;color:var(--muted);font-size:19px;line-height:1.65}.landing .proof{margin-top:40px;color:#71857c;font-size:12px;letter-spacing:.12em;text-transform:uppercase}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:28px 18px}.span4,.span6,.span8{grid-column:span 12}.steps{grid-template-columns:1fr 1fr}.top{padding:0 16px}.hero{display:block}.hero .actions{margin-top:18px}}@media(max-width:520px){.steps{grid-template-columns:1fr}.landing{padding:50px 20px}.landing h1{font-size:55px}.bubble{max-width:92%}}
</style></head><body>
<div id="app"></div><div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalbox"><div class="row"><div><div class="eyebrow">New venture</div><h2 style="margin:7px 0">Tell your AI what you want to build.</h2></div><button class="btn" onclick="closeModal()">✕</button></div><div class="field"><label>Available investment</label><select id="budget"><option>৳100,000 – ৳250,000</option><option>৳250,000 – ৳500,000</option><option>৳500,000 – ৳1,000,000</option><option>$1,000 – $3,000</option></select></div><div class="field"><label>What are you interested in?</label><input id="interest" placeholder="Fashion, beauty, home, electronics..."></div><div class="field"><label>Where will you sell?</label><input id="market" value="Bangladesh"></div><div class="actions"><button class="btn primary" onclick="launchBusiness()">Let AI find my business →</button></div></div></div>
<script>
const state={page:"home",launched:false,chat:[["ai","I’m ready. Tell me your budget, market, or even just what you’re curious about. I’ll turn it into a business opportunity."]]};
const icons={home:"⌂",advisor:"✦",ideas:"◈",products:"□",orders:"↗",brand:"✺",store:"▱",marketing:"◉",support:"◌",analytics:"↗"};
function nav(){return ["home","advisor","ideas","products","orders","brand","store","marketing","support","analytics"].map(x=>`<button class="nav ${state.page===x?"active":""}" onclick="go('${x}')"><span style="width:20px">${icons[x]}</span>${label(x)}</button>`).join("")}
function label(x){return x==="home"?"Overview":x==="advisor"?"AI Advisor":x==="ideas"?"Business Ideas":x==="products"?"Products":x==="orders"?"Sourcing & Orders":x==="brand"?"My Brand":x==="store"?"My Store":x==="marketing"?"Marketing":x==="support"?"Customer Support":"Analytics"}
function shell(content){return `<div class="app"><header class="top"><div class="brand"><div class="mark">F</div>FORGE <span style="color:#6f827a;font-weight:600">AI BUSINESS OS</span></div><div class="topright"><span class="pill">● AI is online</span><span class="pill" onclick="openModal()">+ New business</span><div class="avatar">M</div></div></header><div class="layout"><aside class="side"><div class="navlabel">Business workspace</div>${nav()}<div class="navlabel" style="margin-top:18px">Your business</div><div class="card" style="padding:14px;margin:8px 5px"><div class="biz"><div class="bizicon">◈</div><div><b>Northstar Goods</b><div class="mini">Building · 68%</div></div></div><div class="progress" style="margin-top:13px"><i style="width:68%"></i></div></div></aside><main class="main">${content}</main></div></div>`}
function home(){return `<div class="hero"><div><div class="eyebrow">Wednesday · September 16</div><div class="h1">Your business is being built.</div><div class="sub">Forge is your AI operating team. You make the important choices. We research, source, build, market and optimize the business around them.</div></div><div class="actions"><button class="btn primary" onclick="openModal()">Start a new business →</button></div></div><div class="grid"><div class="card span4"><div class="label">Business health</div><div class="stat">82 / 100</div><div class="up">↑ 8.4% this week</div></div><div class="card span4"><div class="label">Revenue this month</div><div class="stat">৳3.42L</div><div class="up">↑ 18.2% vs last month</div></div><div class="card span4"><div class="label">AI actions completed</div><div class="stat">147</div><div class="up">12 running now</div></div></div><div class="section"><div><h2>Northstar Goods</h2><p>Your first AI-built business · Premium everyday accessories</p></div><button class="btn" onclick="go('advisor')">Ask your AI →</button></div><div class="grid"><div class="card span8"><div class="row"><div><b>Launch command center</b><div class="mini">AI is moving through your launch checklist.</div></div><span class="status">ON TRACK</span></div><div class="steps" style="margin-top:20px"><div class="step"><b>01 · Opportunity</b><span>Completed · market fit found</span></div><div class="step"><b>02 · Sourcing</b><span>Completed · 240 units ordered</span></div><div class="step"><b>03 · Brand & store</b><span>In progress · 68%</span></div><div class="step"><b>04 · Growth</b><span>Waiting for launch</span></div></div></div><div class="card span4"><div class="label">AI recommendation</div><h3>Reorder the Slate Carryall</h3><p class="mini" style="line-height:1.6">Stock is projected to run out in 11 days. Your conversion rate is 34% above the category benchmark.</p><button class="btn primary" onclick="toast('Reorder request sent to operations')">Approve reorder</button></div></div><div class="section"><div><h2>What your AI did today</h2><p>You do not need to manage these tasks manually.</p></div></div><div class="grid"><div class="card span4"><b>Market intelligence</b><p class="mini">Scanned 38 competitor offers and updated your price recommendation.</p></div><div class="card span4"><b>Creative studio</b><p class="mini">Generated 6 social concepts and selected the top 2 for testing.</p></div><div class="card span4"><b>Customer success</b><p class="mini">Answered 41 customer conversations with 96% confidence.</p></div></div>`}
function advisor(){return `<div class="hero"><div><div class="eyebrow">AI co-founder</div><div class="h1">Ask anything about your business.</div><div class="sub">Your advisor can research opportunities, explain decisions, create plans, and recommend the next move.</div></div></div><div class="card"><div class="chat" id="chat">${state.chat.map(m=>`<div class="bubble ${m[0]==="me"?"me":""}">${m[1]}</div>`).join("")}</div><div class="composer"><input id="chatInput" placeholder="e.g. I have ৳2 lakh. What should I sell?" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div><div class="section"><h2>Quick commands</h2></div><div class="actions"><button class="btn" onclick="quick('Find me 3 low-risk businesses for my budget.')">Find a business</button><button class="btn" onclick="quick('What should I reorder this week?')">Review inventory</button><button class="btn" onclick="quick('Create this week’s marketing plan.')">Plan marketing</button></div>`}
function ideas(){return `<div class="hero"><div><div class="eyebrow">Opportunity engine</div><div class="h1">Businesses worth building.</div><div class="sub">AI ranks opportunities using demand, competition, sourcing economics, margin potential and launch complexity.</div></div></div><div class="grid">${[["👜","Premium Carry Goods","৳2.1L","46%","Low","94%"],["👟","Urban Footwear","৳2.8L","42%","Medium","91%"],["🕯️","Home Fragrance","৳1.4L","51%","Low","89%"],["⌚","Modern Watches","৳2.3L","39%","Medium","86%"],["🧴","Everyday Beauty","৳1.8L","48%","Medium","84%"],["🎒","Travel Essentials","৳1.9L","44%","Low","82%"]].map((p,i)=>`<div class="card product span4"><div class="photo">${p[0]}</div><span class="tag">${p[4]} complexity</span><h3>${p[1]}</h3><div class="mini">Suggested starting capital ${p[2]}</div><div class="metric"><span><div class="label">Margin</div><b>${p[3]}</b></span><span><div class="label">AI score</div><b>${p[5]}</b></span></div><button class="btn primary" style="margin-top:17px;width:100%" onclick="openModal()">Explore this business →</button></div>`).join("")}</div>`}
function products(){return `<div class="hero"><div><div class="eyebrow">Sourcing network</div><div class="h1">Products selected for your business.</div><div class="sub">The platform shows the economics you need. Procurement and supplier coordination happen behind the scenes.</div></div><button class="btn primary" onclick="toast('Product sourcing request created')">Request new products</button></div><div class="grid">${[["Slate Carryall","👜","৳1,120","৳2,490","46%","Ready to order"],["Aero Runner","👟","৳1,480","৳3,290","45%","Ready to order"],["Mono Chrono","⌚","৳1,760","৳3,990","44%","Sampling"],["Scent No. 04","🕯️","৳620","৳1,590","51%","Ready to order"]].map(p=>`<div class="card product span6"><div class="row"><div class="photo" style="width:120px;height:120px;margin:0">${p[1]}</div><div style="flex:1;padding-left:15px"><span class="tag">${p[5]}</span><h3>${p[0]}</h3><div class="mini">Your platform price · ${p[2]}</div><div class="price">${p[3]}</div><div class="mini">${p[4]} estimated gross margin</div></div></div><button class="btn primary" style="margin-top:18px" onclick="toast('Order draft created for '+p[0])">Order inventory</button></div>`).join("")}</div>`}
function orders(){return `<div class="hero"><div><div class="eyebrow">Operations</div><div class="h1">Sourcing without the sourcing headache.</div><div class="sub">Your orders move from AI recommendation to procurement to delivery while you stay focused on your customers.</div></div></div><div class="card"><table class="table"><thead><tr><th>Order</th><th>Product</th><th>Units</th><th>Investment</th><th>Status</th></tr></thead><tbody><tr><td>#F-1048</td><td>Slate Carryall</td><td>240</td><td>৳2,68,800</td><td><span class="status">In transit</span></td></tr><tr><td>#F-1042</td><td>Aero Runner</td><td>180</td><td>৳2,66,400</td><td><span class="status">QC passed</span></td></tr><tr><td>#F-1031</td><td>Mono Chrono</td><td>100</td><td>৳1,76,000</td><td><span class="status">Sampling</span></td></tr></tbody></table></div><div class="section"><h2>Payment & procurement flow</h2></div><div class="grid"><div class="card span4"><b>1 · You approve</b><p class="mini">Choose the product and quantity. The platform calculates your total before payment.</p></div><div class="card span4"><b>2 · We procure</b><p class="mini">Your payment is received by the platform and procurement begins through our supplier network.</p></div><div class="card span4"><b>3 · You receive</b><p class="mini">Track QC, shipping and arrival. Then sell locally through your AI-built business.</p></div></div>`}
function brand(){return `<div class="hero"><div><div class="eyebrow">Brand studio</div><div class="h1">Northstar Goods.</div><div class="sub">Your AI has turned a product opportunity into a brand system customers can recognize.</div></div><button class="btn primary" onclick="toast('AI is generating a new brand direction')">Generate new direction</button></div><div class="grid"><div class="card span8"><div style="height:230px;border-radius:14px;background:linear-gradient(135deg,#dcefe2,#89b9a0);color:#092016;padding:28px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font-size:12px;letter-spacing:.2em">NORTHSTAR GOODS</div><div style="font-size:48px;font-weight:800;letter-spacing:-.06em">Carry less.<br>Go further.</div></div></div><div class="card span4"><div class="label">AI brand kit</div><h3>Ready to launch</h3><p class="mini">Logo · Voice · Color system · Packaging · Product naming</p><div class="progress"><i style="width:92%"></i></div><button class="btn" style="margin-top:18px" onclick="toast('Brand kit exported')">Export brand kit</button></div></div><div class="section"><h2>Brand assets</h2></div><div class="grid"><div class="card span4"><b>Voice</b><p class="mini">Calm, useful, quietly premium.</p></div><div class="card span4"><b>Positioning</b><p class="mini">Modern essentials for people who move.</p></div><div class="card span4"><b>Launch story</b><p class="mini">Generated and ready for your store and social channels.</p></div></div>`}
function store(){return `<div class="hero"><div><div class="eyebrow">Commerce</div><div class="h1">Your store is almost live.</div><div class="sub">Forge builds the storefront, product copy, policies and merchandising around the business strategy your AI created.</div></div><button class="btn primary" onclick="toast('Store preview opened')">Preview store ↗</button></div><div class="card"><div class="row"><div><b>northstargoods.store</b><div class="mini">AI storefront · Mobile optimized</div></div><span class="status">68% READY</span></div><div class="progress" style="margin:20px 0"><i style="width:68%"></i></div><div class="steps"><div class="step"><b>Catalog</b><span>12 products</span></div><div class="step"><b>Checkout</b><span>Configured</span></div><div class="step"><b>Policies</b><span>Generated</span></div><div class="step"><b>Domain</b><span>Connect domain</span></div></div></div>`}
function marketing(){return `<div class="hero"><div><div class="eyebrow">Growth engine</div><div class="h1">Marketing that keeps learning.</div><div class="sub">AI plans content, creates creative concepts, monitors campaigns and tells you where your money should go next.</div></div><button class="btn primary" onclick="toast('AI growth cycle started')">Run AI growth cycle</button></div><div class="grid"><div class="card span4"><div class="label">Ad spend</div><div class="stat">৳48,200</div><div class="up">ROAS 3.7×</div></div><div class="card span4"><div class="label">Content generated</div><div class="stat">38</div><div class="up">12 approved automatically</div></div><div class="card span4"><div class="label">CAC</div><div class="stat">৳412</div><div class="up">↓ 16% this month</div></div></div><div class="section"><h2>AI campaign desk</h2></div><div class="card"><table class="table"><thead><tr><th>Campaign</th><th>Channel</th><th>Spend</th><th>ROAS</th><th>AI action</th></tr></thead><tbody><tr><td>Everyday Carry</td><td>Meta</td><td>৳22,400</td><td>4.2×</td><td><span class="status">Scale</span></td></tr><tr><td>Back to Work</td><td>Instagram</td><td>৳14,800</td><td>3.6×</td><td><span class="status">Keep</span></td></tr><tr><td>New Audience Test</td><td>Meta</td><td>৳11,000</td><td>2.1×</td><td><span class="status">Optimize</span></td></tr></tbody></table></div>`}
function support(){return `<div class="hero"><div><div class="eyebrow">AI customer success</div><div class="h1">Your customers have a support team.</div><div class="sub">AI handles routine questions across your channels, escalates uncertainty, and learns from every conversation.</div></div></div><div class="grid"><div class="card span4"><div class="label">Conversations today</div><div class="stat">84</div><div class="up">96% resolved by AI</div></div><div class="card span4"><div class="label">Avg. response</div><div class="stat">11 sec</div><div class="up">24/7 coverage</div></div><div class="card span4"><div class="label">Escalations</div><div class="stat">3</div><div class="up">All routed to you</div></div></div><div class="section"><h2>Recent conversations</h2></div><div class="card"><div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>“Do you have size 42?”</b><div class="mini">AI answered · product availability</div></div><span class="status">Resolved</span></div><div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>“Can I exchange this?”</b><div class="mini">AI answered · policy</div></div><span class="status">Resolved</span></div><div class="row" style="padding:12px 0"><div><b>“I received the wrong color.”</b><div class="mini">Escalated · human review</div></div><span class="status">Needs you</span></div></div>`}
function analytics(){return `<div class="hero"><div><div class="eyebrow">Business intelligence</div><div class="h1">Know what to do next.</div><div class="sub">Not just charts. Every metric is translated into a business decision.</div></div></div><div class="grid"><div class="card span8"><div class="label">Revenue trend</div><div style="height:230px;display:flex;align-items:end;gap:10px;padding:20px 0"><div style="height:32%;flex:1;background:#315446;border-radius:6px"></div><div style="height:44%;flex:1;background:#3d6655;border-radius:6px"></div><div style="height:39%;flex:1;background:#477861;border-radius:6px"></div><div style="height:62%;flex:1;background:#559272;border-radius:6px"></div><div style="height:57%;flex:1;background:#62ae88;border-radius:6px"></div><div style="height:78%;flex:1;background:#7bc9a0;border-radius:6px"></div><div style="height:92%;flex:1;background:#b9f3d0;border-radius:6px"></div></div></div><div class="card span4"><div class="label">AI business verdict</div><h3>Scale inventory.</h3><p class="mini" style="line-height:1.6">Demand is accelerating faster than planned. Increase the next purchase order by 25% while maintaining your current acquisition budget.</p><button class="btn primary" onclick="toast('Decision added to your action plan')">Add to action plan</button></div></div>`}
function render(){let c=state.page==="home"?home():state.page==="advisor"?advisor():state.page==="ideas"?ideas():state.page==="products"?products():state.page==="orders"?orders():state.page==="brand"?brand():state.page==="store"?store():state.page==="marketing"?marketing():state.page==="support"?support():analytics();document.getElementById("app").innerHTML=shell(c)}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function openModal(){document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function launchBusiness(){closeModal();state.launched=true;state.page="advisor";state.chat=[["ai","I’ve got it. I’m analyzing your budget, market and interests now."],["ai","Your first opportunity: a premium everyday accessories brand. Estimated starting capital: ৳2.1 lakh. AI confidence: 94%."],["ai","I can now map the products, margins, sourcing plan, brand direction and launch sequence. You stay in control of the important choices."]];render();toast("Your AI business workspace is ready")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function quick(t){document.getElementById("chatInput").value=t;sendChat()}
function sendChat(){const i=document.getElementById("chatInput");const v=i.value.trim();if(!v)return;state.chat.push(["me",v]);state.chat.push(["ai",answer(v)]);render();setTimeout(()=>{const el=document.getElementById("chat");if(el)el.lastElementChild.scrollIntoView({behavior:"smooth",block:"end"})},30)}
function answer(v){v=v.toLowerCase();if(v.includes("business")||v.includes("sell"))return "Based on the profile I have, I would shortlist premium carry goods, urban footwear and home fragrance. Carry goods currently has the best balance of margin, sourcing simplicity and demand. I recommend starting with 3–5 hero products rather than a large catalog.";if(v.includes("marketing"))return "This week: launch two product-led creatives, retarget engaged visitors, and shift 15% of spend toward the best-performing audience. I’ll watch the results and recommend the next move.";if(v.includes("inventory")||v.includes("reorder"))return "Slate Carryall is the priority. At the current run rate, projected stockout is 11 days away. I recommend 300 additional units and keeping the current price.";return "I can turn that into an operating plan. I’ll look at demand, competition, sourcing economics, margin and execution complexity, then give you a clear recommendation—not just a list of ideas."}
render();
</script></body></html>
