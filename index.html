<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06110e"><meta name="description" content="Forge — AI Business OS. Discover, source, launch, market and operate a business with an AI operating team.">
<title>Forge — AI Business OS</title>
<style>
:root{--bg:#06100d;--panel:#0b1713;--panel2:#0f1e19;--line:#1e322a;--text:#f4f8f5;--muted:#8fa49a;--mint:#b9f3d0;--mint2:#69dda0;--blue:#9bd3ff;--amber:#f2ce83;--red:#ff9898;--shadow:0 30px 90px #0008}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 650px at 78% -8%,#173c2e 0,transparent 58%),radial-gradient(700px 500px at 15% 100%,#0d2920 0,transparent 60%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#06100de8;backdrop-filter:blur(20px);z-index:30}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),#5bcf99);display:grid;place-items:center;color:#082017;font-weight:950}.brand small{font-size:12px;color:#6e837a;font-weight:650}.topright{display:flex;align-items:center;gap:10px}.pill,.avatar,.btn{border:1px solid var(--line);background:#0c1915;color:#dbe9e2;border-radius:11px}.pill{padding:8px 12px;font-size:12px}.online{color:var(--mint);border-color:#27523e}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#172a23}.layout{display:flex}.side{width:248px;min-height:calc(100vh - 70px);border-right:1px solid var(--line);padding:18px 12px;position:fixed;top:70px;bottom:0;overflow:auto}.navlabel{font-size:10px;color:#60766c;text-transform:uppercase;letter-spacing:.17em;padding:13px 12px 8px}.nav{width:100%;border:0;background:transparent;color:#8da198;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;text-align:left;margin:2px 0}.nav:hover,.nav.active{background:#13231d;color:#f2faf6}.nav.active{box-shadow:inset 2px 0 var(--mint)}.nav .ico{width:18px;text-align:center;color:#789187}.business-mini{margin:10px 4px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1814}.bizrow{display:flex;gap:10px;align-items:center}.bizicon{width:42px;height:42px;border-radius:12px;background:#173127;display:grid;place-items:center}.progress{height:6px;background:#162821;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mint2));border-radius:99px}.main{margin-left:248px;width:calc(100% - 248px);max-width:1540px;padding:38px 46px 90px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:30px}.eyebrow{font-size:11px;color:var(--mint2);font-weight:850;text-transform:uppercase;letter-spacing:.18em}.h1{font-size:clamp(38px,5vw,70px);line-height:.95;letter-spacing:-.07em;margin:11px 0 15px;max-width:900px}.sub{font-size:16px;line-height:1.65;color:var(--muted);max-width:780px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{padding:11px 15px;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.primary{background:var(--mint);color:#061a12;border-color:var(--mint)}.ghost{background:transparent}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card{background:linear-gradient(145deg,#0d1a16,#09140f);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 45px #0002}.stat{font-size:30px;font-weight:850;letter-spacing:-.05em;margin:9px 0}.label{font-size:11px;color:#71877d;text-transform:uppercase;letter-spacing:.12em}.up{font-size:12px;color:var(--mint2)}.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:end;margin:38px 0 16px}.section h2{margin:0;font-size:21px;letter-spacing:-.035em}.section p{margin:5px 0 0;color:var(--muted);font-size:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.step{padding:14px;border:1px solid var(--line);background:#0d1a16;border-radius:12px}.step b{display:block;margin-bottom:6px}.step span{font-size:11px;color:var(--muted);line-height:1.45}.status{display:inline-flex;padding:5px 8px;border-radius:99px;background:#173329;color:#9deabd;font-size:10px;font-weight:850;text-transform:uppercase}.status.amber{background:#302817;color:var(--amber)}.metric{display:flex;gap:28px;margin-top:15px}.metric b{font-size:17px}.product-photo{height:145px;border-radius:13px;background:radial-gradient(circle at 45% 35%,#3a5b4e,#152820 55%,#0c1713);display:grid;place-items:center;font-size:57px;margin-bottom:15px}.tag{display:inline-flex;padding:5px 8px;border-radius:99px;background:#153127;color:#9ce9bb;font-size:10px;font-weight:850}.price{font-size:23px;font-weight:850;margin-top:9px}.product h3{margin:6px 0 4px;font-size:16px}.small{font-size:12px;color:var(--muted);line-height:1.55}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:9px;color:#698077;text-transform:uppercase;letter-spacing:.14em}.chat{display:flex;flex-direction:column;gap:12px;max-width:900px}.bubble{max-width:78%;padding:14px 16px;border:1px solid var(--line);background:#13221d;border-radius:16px;line-height:1.55}.bubble.me{align-self:flex-end;background:var(--mint);color:#061a12;border-color:var(--mint)}.composer{display:flex;gap:8px;margin-top:14px}.input{width:100%;background:#07110e;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:0}.input:focus{border-color:#4e9c76}.filterbar{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px}.field label{display:block;font-size:10px;color:#789087;text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}.field{margin-bottom:13px}.range{display:flex;gap:8px}.range .input{min-width:0}.score{height:8px;background:#182a23;border-radius:99px;overflow:hidden}.score i{display:block;height:100%;background:linear-gradient(90deg,#63d99a,var(--mint));border-radius:99px}.choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0a1713;color:#b9c9c1;text-align:left}.choice.selected{border-color:#58a97e;background:#10261d;color:#e9fff1}.wizard{max-width:850px;margin:auto}.wizard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dots{display:flex;gap:6px}.dots i{width:28px;height:4px;border-radius:9px;background:#20332b}.dots i.on{background:var(--mint)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:80}.modal.open{display:grid}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0a1612;border:1px solid #294238;border-radius:21px;padding:25px;box-shadow:var(--shadow)}.toast{position:fixed;right:22px;bottom:22px;background:#d9ffe8;color:#061a12;padding:13px 16px;border-radius:12px;font-weight:800;display:none;z-index:100}.kpi{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.kpi:last-child{border:0}.chart{height:220px;display:flex;align-items:end;gap:8px;padding:15px 0}.bar{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#a7e9c1,#2f6750);min-height:12px}.hero-banner{padding:25px;border-radius:18px;background:linear-gradient(115deg,#123027,#0b1814);border:1px solid #24463a}.asset{min-height:100px;padding:17px;border-radius:13px;background:#101f19;border:1px solid var(--line)}@media(max-width:1000px){.side{display:none}.main{margin:0;width:100%;padding:28px 18px}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.filterbar{grid-template-columns:1fr 1fr}.hero{display:block}.hero .actions{margin-top:18px}.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{padding:0 14px}.brand small,.online{display:none}.filterbar{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.h1{font-size:47px}.main{padding:24px 14px}.card{padding:16px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const state={page:"home",business:null,chat:[["ai","I’m your AI co-founder. Give me a budget, market, experience level, interests—or nothing at all. I’ll turn it into a practical business plan."]],filters:{budget:250000,age:30,income:50000,market:"Bangladesh",category:"Any",risk:"Balanced",goal:"Profit + growth"}};
const icons={home:"⌂",advisor:"✦",ideas:"◈",products:"□",orders:"↗",brand:"✺",store:"▱",marketing:"◎",support:"◌",analytics:"⌁"};
const labels={home:"Overview",advisor:"AI Advisor",ideas:"Business Finder",products:"Products",orders:"Sourcing & Orders",brand:"Brand Studio",store:"Store Launch",marketing:"AI Marketing",support:"AI Customer Support",analytics:"Analytics & Decisions"};
function nav(){return Object.keys(labels).map(k=>`<button class="nav ${state.page===k?"active":""}" onclick="go('${k}')"><span class="ico">${icons[k]}</span>${labels[k]}</button>`).join("")}
function shell(c){return `<header class="top"><div class="brand"><div class="mark">F</div>FORGE <small>AI BUSINESS OS</small></div><div class="topright"><span class="pill online">● AI is online</span><button class="pill" onclick="openWizard()">＋ New business</button><div class="avatar">M</div></div></header><div class="layout"><aside class="side"><div class="navlabel">Business workspace</div>${nav()}<div class="navlabel" style="margin-top:18px">Your business</div><div class="business-mini"><div class="bizrow"><div class="bizicon">◈</div><div><b>${state.business?.name||"No business yet"}</b><div class="small">${state.business?"AI plan · 68%":"Start your first venture"}</div></div></div><div class="progress" style="margin-top:12px"><i style="width:${state.business?68:0}%"></i></div></div></aside><main class="main">${c}</main></div>`}
function home(){return `<div class="hero"><div><div class="eyebrow">Your AI operating team</div><div class="h1">Build a business.<br>Not a pile of tasks.</div><div class="sub">Forge helps an entrepreneur go from <b>“I want to start something”</b> to product selection, procurement, brand, store, marketing, customer support and business decisions—inside one workspace.</div></div><div class="actions"><button class="btn primary" onclick="openWizard()">Start a new business →</button><button class="btn ghost" onclick="go('ideas')">Find an opportunity</button></div></div>
<div class="hero-banner"><div class="grid"><div class="span7"><div class="eyebrow">The promise</div><h2 style="font-size:28px;letter-spacing:-.04em;margin:8px 0">You make the important choices. Forge does the operating work.</h2><div class="small">Choose a product and approve the big decisions. Behind the scenes, the platform can connect sourcing, commerce, creative, advertising, support and analytics.</div></div><div class="span5"><div class="steps"><div class="step"><b>01 · Discover</b><span>Find opportunities matched to your profile.</span></div><div class="step"><b>02 · Source</b><span>Compare landed economics and order inventory.</span></div><div class="step"><b>03 · Launch</b><span>AI creates your brand and storefront.</span></div><div class="step"><b>04 · Grow</b><span>AI runs the operating loop and recommends decisions.</span></div></div></div></div></div>
<div class="section"><div><h2>${state.business?"${state.business.name} command center":"Your command center"}</h2><p>${state.business?"AI is building your launch plan around your profile.":"A realistic example of what your operating workspace becomes."}</p></div><button class="btn" onclick="go('advisor')">Ask your AI →</button></div>
<div class="grid"><div class="card span4"><div class="label">Business health</div><div class="stat">${state.business?"91 / 100":"—"}</div><div class="up">${state.business?"↑ 8.4% this week":"Create a business to activate"}</div></div><div class="card span4"><div class="label">Capital to deploy</div><div class="stat">${state.business?money(state.business.budget):"—"}</div><div class="small">${state.business?"AI protects a reserve for testing":"Set your budget during onboarding"}</div></div><div class="card span4"><div class="label">AI actions queued</div><div class="stat">${state.business?"18":"—"}</div><div class="up">${state.business?"6 waiting for approval":"Your operating team is idle"}</div></div></div>
<div class="section"><div><h2>What Forge can own</h2><p>Designed as an operating system, not a chatbot.</p></div></div>
<div class="grid">${[["Business strategy","Turn your money, skills, location and goals into a business thesis."],["Product intelligence","Score products by demand, competition, margin, complexity and sourcing."],["Procurement","Show your price, landed cost, MOQ, lead time and order status."],["Brand + store","Generate naming, positioning, copy, catalog and storefront assets."],["Growth","Create campaigns, content and experiments; watch results and recommend action."],["Customer operations","Answer routine questions, manage escalations and learn from conversations."]].map(x=>`<div class="card span4"><b>${x[0]}</b><p class="small">${x[1]}</p></div>`).join("")}</div>`}
function openWizard(){let s=1;let data={budget:"250000",market:"Bangladesh",category:"Fashion & accessories",age:"28",income:"50000",experience:"Beginner",goal:"Profit + growth"};function draw(){document.getElementById("modalbox").innerHTML=`<div class="wizard"><div class="wizard-head"><div><div class="eyebrow">New venture</div><h2 style="margin:6px 0 3px">Let’s build around you.</h2><div class="small">Forge needs context—not a 50-question business plan.</div></div><button class="btn" onclick="closeModal()">✕</button></div><div class="dots">${[1,2,3,4].map(i=>`<i class="${i<=s?"on":""}"></i>`).join("")}</div><div style="margin-top:22px">${s===1?`<h3>How much can you deploy?</h3><div class="grid"><div class="span6 field"><label>Total available capital</label><select class="input" id="wbudget"><option value="100000">৳1–2 lakh</option><option value="250000" selected>৳2–5 lakh</option><option value="500000">৳5–10 lakh</option><option value="1000000">৳10 lakh+</option></select></div><div class="span6 field"><label>Primary market</label><select class="input" id="wmarket"><option>Bangladesh</option><option>India</option><option>UAE</option><option>Saudi Arabia</option><option>USA</option></select></div></div>`:s===2?`<h3>Who are you?</h3><div class="grid"><div class="span6 field"><label>Your age</label><input class="input" id="wage" type="number" value="28"></div><div class="span6 field"><label>Monthly income</label><input class="input" id="wincome" type="number" value="50000"></div><div class="span12 field"><label>Experience</label><div class="actions">${["Complete beginner","Some business experience","Experienced operator"].map(v=>`<button class="choice ${data.experience===v?"selected":""}" onclick="data.experience='${v}';draw()">${v}</button>`).join("")}</div></div></div>`:s===3?`<h3>What should Forge optimize for?</h3><div class="grid"><div class="span6 field"><label>Category interest</label><select class="input" id="wcat"><option>Fashion & accessories</option><option>Beauty & personal care</option><option>Home & living</option><option>Electronics</option><option>Food & beverage</option><option>Sports & fitness</option><option>Open to anything</option></select></div><div class="span6 field"><label>Business goal</label><select class="input" id="wgoal"><option>Profit + growth</option><option>Low-risk side income</option><option>Build a long-term brand</option><option>Fastest path to revenue</option></select></div></div><p class="small">Forge will also consider your market, capital, experience and operating complexity. You do not need to know the “right” product.</p>`: `<div style="text-align:center;padding:25px 0"><div style="font-size:50px">✦</div><h2>Ready to find your business.</h2><p class="small">We’ll rank opportunities, estimate economics, shortlist products and build your launch sequence. You approve the important decisions.</p></div>`}</div><div class="actions" style="justify-content:flex-end;margin-top:24px">${s>1?`<button class="btn" onclick="s--;draw()">← Back</button>`:""}<button class="btn primary" onclick="${s<4?"s++;draw()":"finishWizard()"}">${s<4?"Continue →":"Find my business →"}</button></div></div>`;};window.finishWizard=()=>{state.business={name:"Northstar Goods",budget:Number(document.getElementById("wbudget")?.value||data.budget),market:document.getElementById("wmarket")?.value||data.market,category:document.getElementById("wcat")?.value||data.category,age:Number(document.getElementById("wage")?.value||28),income:Number(document.getElementById("wincome")?.value||50000),goal:document.getElementById("wgoal")?.value||data.goal};state.filters={...state.filters,budget:state.business.budget,age:state.business.age,income:state.business.income,market:state.business.market,category:state.business.category,goal:state.business.goal};closeModal();state.page="ideas";render();toast("AI opportunity engine is ready");};document.getElementById("modal").classList.add("open");draw()}
function ideas(){return `<div class="hero"><div><div class="eyebrow">AI opportunity engine</div><div class="h1">Find the business that fits you.</div><div class="sub">Instead of asking “what is trending?”, Forge asks “what is likely to work <b>for this person</b>?” Adjust the profile and the ranking changes.</div></div></div>
<div class="card"><div class="filterbar"><div class="field"><label>Available capital</label><select class="input" id="fbudget" onchange="filterChange()"><option value="100000">৳1–2 lakh</option><option value="250000" selected>৳2–5 lakh</option><option value="500000">৳5–10 lakh</option><option value="1000000">৳10 lakh+</option></select></div><div class="field"><label>Your age</label><input class="input" id="fage" type="number" value="${state.filters.age}" oninput="filterChange()"></div><div class="field"><label>Monthly income</label><input class="input" id="fincome" type="number" value="${state.filters.income}" oninput="filterChange()"></div><div class="field"><label>Market</label><select class="input" id="fmarket" onchange="filterChange()"><option>Bangladesh</option><option>India</option><option>UAE</option><option>Saudi Arabia</option><option>USA</option></select></div></div><div class="filterbar" style="margin-top:8px"><div class="field"><label>Interest</label><select class="input" id="fcat"><option>Any</option><option>Fashion & accessories</option><option>Beauty & personal care</option><option>Home & living</option><option>Electronics</option><option>Sports & fitness</option></select></div><div class="field"><label>Risk appetite</label><select class="input" id="frisk"><option>Conservative</option><option selected>Balanced</option><option>Aggressive</option></select></div><div class="field"><label>Primary goal</label><select class="input" id="fgoal"><option>Profit + growth</option><option>Low-risk side income</option><option>Long-term brand</option><option>Fastest revenue</option></select></div><div class="field"><label>AI confidence</label><div style="padding:12px 0"><span class="status">Personalized</span></div></div></div></div>
<div class="section"><div><h2>Top opportunities for you</h2><p>Ranked by fit, economics and execution feasibility.</p></div><button class="btn" onclick="toast('38 opportunities analyzed')">Refresh analysis ↻</button></div>
<div class="grid">${opps().map((p,i)=>`<div class="card span4"><div class="row"><span class="tag">#${i+1} · ${p.fit}% fit</span><span class="status ${p.risk==="Medium"?"amber":""}">${p.risk} risk</span></div><div class="product-photo">${p.icon}</div><h3 style="font-size:18px;margin:0 0 5px">${p.name}</h3><div class="small">${p.thesis}</div><div class="metric"><span><div class="label">Est. margin</div><b>${p.margin}%</b></span><span><div class="label">Start capital</div><b>${money(p.cap)}</b></span><span><div class="label">Complexity</div><b>${p.cx}</b></span></div><div style="margin-top:15px"><div class="label" style="margin-bottom:6px">AI opportunity score</div><div class="score"><i style="width:${p.fit}%"></i></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="selectOpportunity('${p.name}')">Build this business →</button></div>`).join("")}</div>`}
function opps(){let cat=(document.getElementById("fcat")?.value||state.filters.category||"Any");let base=[["Premium carry goods","👜","Everyday accessories with simple SKUs and strong branding room.",46,210000,"Low",94],["Urban footwear","👟","Trend-aware footwear with repeatable creative and healthy AOV.",42,280000,"Medium",91],["Home fragrance","🕯️","Giftable products with high perceived value and compact logistics.",51,140000,"Low",89],["Modern watches","⌚","Accessible premium watches where design drives differentiation.",39,230000,"Medium",86],["Everyday beauty","🧴","Consumable personal-care products with strong repeat potential.",48,180000,"Medium",84],["Travel essentials","🎒","Functional accessories for commuters and travelers.",44,190000,"Low",82]];if(cat!=="Any")base=base.filter(p=>({ "Fashion & accessories":["Premium carry goods","Urban footwear","Modern watches"],"Beauty & personal care":["Everyday beauty"],"Home & living":["Home fragrance"],"Sports & fitness":["Travel essentials"]}[cat]||[]).includes(p[0]));return base.map((p,i)=>({name:p[0],icon:p[1],thesis:p[2],margin:p[3],cap:p[4],risk:p[5],fit:Math.max(70,p[6]-(state.filters.age%7)) ,cx:p[5]==="Low"?"Simple":"Moderate"}))}
function filterChange(){state.filters.budget=Number(document.getElementById("fbudget").value);state.filters.age=Number(document.getElementById("fage").value);state.filters.income=Number(document.getElementById("fincome").value);state.filters.market=document.getElementById("fmarket").value;render()}
function selectOpportunity(name){state.business={...(state.business||{}),name:name,budget:state.filters.budget,market:state.filters.market,category:state.filters.category};state.page="advisor";state.chat.push(["ai",`I’ve selected ${name} as the leading opportunity. Next I’ll map the hero products, target customer, sourcing economics, brand angle and launch sequence around your profile.`]);render();toast(name+" added to your business plan")}
function advisor(){return `<div class="hero"><div><div class="eyebrow">AI co-founder</div><div class="h1">One place to think, decide and execute.</div><div class="sub">Ask in plain language. Forge turns questions into research, recommendations, action plans and approvals.</div></div></div><div class="grid"><div class="card span8"><div class="chat" id="chat">${state.chat.map(m=>`<div class="bubble ${m[0]==="me"?"me":""}">${m[1]}</div>`).join("")}</div><div class="composer"><input class="input" id="chatInput" placeholder="“I have ৳2 lakh. What should I sell?”" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div><div class="card span4"><div class="label">AI operating mode</div><h3>${state.business?"${state.business.name}":"Discovery mode"}</h3><div class="kpi"><span>Research</span><b>Active</b></div><div class="kpi"><span>Sourcing</span><b>Ready</b></div><div class="kpi"><span>Marketing</span><b>Ready</b></div><div class="kpi"><span>Support</span><b>Ready</b></div></div></div><div class="section"><div><h2>Quick commands</h2><p>Use the AI like an operating partner.</p></div></div><div class="actions"><button class="btn" onclick="quick('Find me the best 3 products for my budget and explain why.')">Find products</button><button class="btn" onclick="quick('Build my launch plan for the next 30 days.')">Build launch plan</button><button class="btn" onclick="quick('Create my first marketing campaign.')">Create campaign</button><button class="btn" onclick="quick('Tell me the biggest risk in this business.')">Find risks</button></div>`}
function products(){let ps=[["Slate Carryall","👜","৳1,120","৳2,490",46,"Strong fit"],["Aero Runner","👟","৳1,480","৳3,290",45,"Strong fit"],["Mono Chrono","⌚","৳1,760","৳3,990",44,"Test first"],["Scent No. 04","🕯️","৳620","৳1,590",51,"Strong fit"],["Everyday Tote","👜","৳890","৳2,190",47,"New"],["Core Belt","🧷","৳430","৳1,190",53,"High margin"]];return `<div class="hero"><div><div class="eyebrow">Product intelligence</div><div class="h1">Products with the numbers attached.</div><div class="sub">Forge should never show you a product without showing why it fits, what it costs, how much you could sell it for and what to do next.</div></div><button class="btn primary" onclick="go('ideas')">Change product strategy</button></div><div class="card" style="margin-bottom:15px"><div class="filterbar"><div class="field"><label>Search products</label><input class="input" placeholder="e.g. leather wallet, sneakers..." oninput="toast('AI search ready — connect catalog API for live results')"></div><div class="field"><label>Max landed cost</label><select class="input"><option>Any</option><option>৳500</option><option>৳1,000</option><option>৳2,000</option></select></div><div class="field"><label>Target margin</label><select class="input"><option>40%+</option><option>50%+</option><option>60%+</option></select></div><div class="field"><label>Supplier preference</label><select class="input"><option>Best value</option><option>Fastest</option><option>Lowest MOQ</option></select></div></div></div><div class="grid">${ps.map(p=>`<div class="card span6"><div class="row"><div class="product-photo" style="width:125px;height:125px;margin:0">${p[1]}</div><div style="flex:1;padding-left:15px"><span class="tag">${p[5]}</span><h3>${p[0]}</h3><div class="small">Estimated landed cost · ${p[2]}</div><div class="price">${p[3]}</div><div class="small">${p[4]}% estimated gross margin</div></div></div><div class="metric"><span><div class="label">AI fit</div><b>94/100</b></span><span><div class="label">MOQ</div><b>100–240</b></span><span><div class="label">Lead time</div><b>18–28d</b></span></div><button class="btn primary" style="margin-top:17px" onclick="toast('Order draft created for ${p[0]}')">Review & order →</button></div>`).join("")}</div>`}
function orders(){return `<div class="hero"><div><div class="eyebrow">Procurement OS</div><div class="h1">You choose. We source.</div><div class="sub">The future procurement layer can hide supplier complexity while still giving you the economics, status and approvals that matter.</div></div></div><div class="grid"><div class="card span4"><div class="label">Capital committed</div><div class="stat">৳5.11L</div><div class="small">Across 3 purchase orders</div></div><div class="card span4"><div class="label">Units in transit</div><div class="stat">520</div><div class="up">ETA 18–26 days</div></div><div class="card span4"><div class="label">QC pass rate</div><div class="stat">98.2%</div><div class="up">↑ 1.4% vs last batch</div></div></div><div class="section"><div><h2>Purchase orders</h2><p>Every order has a clear state and next action.</p></div><button class="btn primary" onclick="go('products')">Source more products</button></div><div class="card"><table class="table"><thead><tr><th>PO</th><th>Product</th><th>Units</th><th>Landed cost</th><th>ETA</th><th>Status</th></tr></thead><tbody><tr><td>#F-1048</td><td>Slate Carryall</td><td>240</td><td>৳2,68,800</td><td>21 Sep</td><td><span class="status">In transit</span></td></tr><tr><td>#F-1042</td><td>Aero Runner</td><td>180</td><td>৳2,66,400</td><td>27 Sep</td><td><span class="status">QC passed</span></td></tr><tr><td>#F-1031</td><td>Mono Chrono</td><td>100</td><td>৳1,76,000</td><td>02 Oct</td><td><span class="status amber">Sampling</span></td></tr></tbody></table></div><div class="section"><h2>How the money flows</h2></div><div class="grid"><div class="card span4"><b>1 · Approve</b><p class="small">You approve the product, quantity and final payable amount before procurement.</p></div><div class="card span4"><b>2 · Platform procures</b><p class="small">The operating company handles supplier coordination, QC, shipping and tracking through its network.</p></div><div class="card span4"><b>3 · You receive & sell</b><p class="small">Inventory arrives to you. Your AI commerce stack is already prepared to sell it.</p></div></div>`}
function brand(){return `<div class="hero"><div><div class="eyebrow">AI brand studio</div><div class="h1">A brand built around the product.</div><div class="sub">Name, positioning, visual direction, product storytelling, packaging copy and launch assets can all come from the same business thesis.</div></div><button class="btn primary" onclick="toast('AI brand direction generated')">Generate new direction</button></div><div class="grid"><div class="card span8"><div style="height:250px;border-radius:14px;background:linear-gradient(135deg,#dff5e7,#82b99e);color:#071b12;padding:28px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font-size:11px;letter-spacing:.22em">NORTHSTAR GOODS</div><div style="font-size:48px;font-weight:850;letter-spacing:-.07em;line-height:.95">Carry less.<br>Go further.</div></div></div><div class="card span4"><div class="label">Brand readiness</div><div class="stat">92%</div><div class="progress"><i style="width:92%"></i></div><div class="kpi"><span>Positioning</span><b>Done</b></div><div class="kpi"><span>Product naming</span><b>Done</b></div><div class="kpi"><span>Packaging</span><b>Ready</b></div><button class="btn" onclick="toast('Brand kit exported')">Export brand kit</button></div></div><div class="section"><h2>AI-generated assets</h2></div><div class="grid">${[["Voice","Calm, useful, quietly premium."],["Positioning","Modern essentials for people who move."],["Launch story","A concise founder-to-customer narrative."],["Catalog copy","SEO-aware product pages and descriptions."],["Packaging","Front, back and insert copy."],["Social system","Hooks, captions, creative directions and CTAs."]].map(x=>`<div class="asset span4"><b>${x[0]}</b><p class="small">${x[1]}</p></div>`).join("")}</div>`}
function store(){return `<div class="hero"><div><div class="eyebrow">Commerce launch center</div><div class="h1">Your store should launch itself.</div><div class="sub">AI prepares the storefront, catalog, merchandising, policies, SEO and launch checklist. Human approval stays at the important checkpoints.</div></div><button class="btn primary" onclick="toast('Store preview opened')">Preview store ↗</button></div><div class="card"><div class="row"><div><b>northstargoods.store</b><div class="small">Mobile-first · Conversion optimized · AI catalog</div></div><span class="status">68% ready</span></div><div class="progress" style="margin:18px 0"><i style="width:68%"></i></div><div class="steps"><div class="step"><b>Catalog</b><span>12 products + copy</span></div><div class="step"><b>Checkout</b><span>Payment & delivery rules</span></div><div class="step"><b>Trust</b><span>Policies & FAQ generated</span></div><div class="step"><b>Domain</b><span>Connect when ready</span></div></div></div><div class="section"><h2>Launch checklist</h2></div><div class="grid">${["Storefront design","Product photography","Descriptions & SEO","Payment setup","Delivery rules","Meta pixel / analytics","WhatsApp / chat","Order notifications"].map((x,i)=>`<div class="card span3"><div class="row"><b>${x}</b><span class="status">${i<5?"Done":"Next"}</span></div><p class="small">AI-managed setup with an approval checkpoint.</p></div>`).join("")}</div>`}
function marketing(){return `<div class="hero"><div><div class="eyebrow">Autonomous growth loop</div><div class="h1">Marketing that learns every day.</div><div class="sub">Forge turns your business thesis into campaigns, creative tests, audience experiments and budget decisions—then feeds performance back into the business.</div></div><button class="btn primary" onclick="toast('AI growth cycle started')">Run growth cycle →</button></div><div class="grid"><div class="card span4"><div class="label">Ad spend</div><div class="stat">৳48,200</div><div class="up">ROAS 3.7×</div></div><div class="card span4"><div class="label">Creative tests</div><div class="stat">38</div><div class="up">12 winners identified</div></div><div class="card span4"><div class="label">Customer acquisition</div><div class="stat">৳412</div><div class="up">↓ 16% this month</div></div></div><div class="section"><h2>AI campaign desk</h2></div><div class="card"><table class="table"><thead><tr><th>Campaign</th><th>Channel</th><th>Spend</th><th>ROAS</th><th>AI recommendation</th></tr></thead><tbody><tr><td>Everyday Carry</td><td>Meta</td><td>৳22,400</td><td>4.2×</td><td><span class="status">Scale 20%</span></td></tr><tr><td>Back to Work</td><td>Instagram</td><td>৳14,800</td><td>3.6×</td><td><span class="status">Keep</span></td></tr><tr><td>New Audience Test</td><td>Meta</td><td>৳11,000</td><td>2.1×</td><td><span class="status amber">Optimize</span></td></tr></tbody></table></div><div class="section"><h2>Creative factory</h2></div><div class="grid">${["3-second hook","Product benefit reel","UGC script","Founder story","Offer creative","Retargeting angle"].map(x=>`<div class="asset span4"><b>${x}</b><p class="small">AI brief ready · Generate variants →</p></div>`).join("")}</div>`}
function support(){return `<div class="hero"><div><div class="eyebrow">AI customer success</div><div class="h1">Your customers get an answer before they leave.</div><div class="sub">AI handles product questions, order status, policies and routine support. Low-confidence or sensitive cases can escalate to you.</div></div></div><div class="grid"><div class="card span4"><div class="label">Conversations today</div><div class="stat">84</div><div class="up">96% resolved by AI</div></div><div class="card span4"><div class="label">Average response</div><div class="stat">11 sec</div><div class="up">24/7 coverage</div></div><div class="card span4"><div class="label">Human escalations</div><div class="stat">3</div><div class="up">All routed with context</div></div></div><div class="section"><h2>AI support queue</h2></div><div class="card"><div class="kpi"><span><b>“Do you have size 42?”</b><div class="small">Availability · answered from catalog</div></span><span class="status">Resolved</span></div><div class="kpi"><span><b>“Can I exchange this?”</b><div class="small">Policy · answered from rules</div></span><span class="status">Resolved</span></div><div class="kpi"><span><b>“Wrong color received.”</b><div class="small">Order issue · evidence requested</div></span><span class="status amber">Needs you</span></div></div>`}
function analytics(){return `<div class="hero"><div><div class="eyebrow">Decision intelligence</div><div class="h1">Not more dashboards. Better decisions.</div><div class="sub">Forge connects sales, inventory, marketing and customer signals so the next action is visible—not buried in charts.</div></div></div><div class="grid"><div class="card span8"><div class="label">Revenue trajectory</div><div class="chart">${[32,44,39,62,57,78,92].map(h=>`<div class="bar" style="height:${h}%"></div>`).join("")}</div><div class="small">Last 7 reporting periods · indexed</div></div><div class="card span4"><div class="label">AI business verdict</div><h2 style="margin:9px 0">Scale inventory.</h2><p class="small">Demand is accelerating faster than plan. Increase the next purchase order by 25% while maintaining the current acquisition budget.</p><button class="btn primary" onclick="toast('Decision added to action plan')">Approve decision</button></div></div><div class="section"><h2>Business scorecard</h2></div><div class="grid">${[["Demand","Strong","92"],["Unit economics","Healthy","88"],["Cash efficiency","Watch","71"],["Customer experience","Excellent","95"],["Inventory risk","Watch","68"],["Marketing efficiency","Strong","90"]].map(x=>`<div class="card span4"><div class="row"><b>${x[0]}</b><span class="status ${x[1]==="Watch"?"amber":""}">${x[1]}</span></div><div class="stat">${x[2]}</div><div class="score"><i style="width:${x[2]}%"></i></div></div>`).join("")}</div>`}
function money(n){return "৳"+Number(n||0).toLocaleString("en-BD")}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",2600)}
function quick(t){let i=document.getElementById("chatInput");i.value=t;sendChat()}
function sendChat(){let i=document.getElementById("chatInput"),v=i.value.trim();if(!v)return;state.chat.push(["me",v]);state.chat.push(["ai",answer(v)]);render();setTimeout(()=>{let e=document.getElementById("chat");e?.lastElementChild.scrollIntoView({behavior:"smooth"})},20)}
function answer(v){let s=v.toLowerCase();if(s.includes("product")||s.includes("sell")||s.includes("business"))return `For your current profile, I’d shortlist premium carry goods, urban footwear and home fragrance. My first pick is premium carry goods because the combination of ${money(state.filters.budget)} capital, manageable SKU complexity and margin gives you room to test without overcommitting inventory. Next I’d validate 3–5 hero products.`;if(s.includes("marketing")||s.includes("campaign"))return "I’d start with one product-led campaign, one UGC-style creative and one retargeting sequence. Keep the first budget concentrated, then let conversion and contribution margin—not vanity metrics—decide what gets scaled.";if(s.includes("risk"))return "The biggest early risk is buying too much inventory before demand is proven. I recommend a small first batch, clear reorder thresholds and a reserve for creative and customer acquisition.";if(s.includes("launch"))return "Your first 30 days: validate 3 hero products → approve procurement → finalize brand kit → launch a mobile-first store → publish 10–15 creative variants → collect customer objections → optimize price, creative and inventory weekly.";return "I can research the opportunity, explain the economics, compare options, create the operating plan and turn the decision into an action. Tell me what you’re trying to accomplish.";}
function render(){let c={home,advisor,ideas,products,orders,brand,store,marketing,support,analytics}[state.page]();document.getElementById("app").innerHTML=shell(c)}
render();
</script>
