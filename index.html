<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06110e">
<meta name="description" content="Forge — AI Business OS for entrepreneurs.">
<title>Forge — AI Business OS</title>
<style>
:root{--bg:#06100d;--panel:#0b1713;--panel2:#0f1e19;--line:#1e322a;--text:#f4f8f5;--muted:#8fa49a;--mint:#b9f3d0;--mint2:#69dda0;--amber:#f2ce83;--red:#ff9898;--blue:#9bd3ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 650px at 78% -8%,#173c2e 0,transparent 58%),radial-gradient(700px 500px at 15% 100%,#0d2920 0,transparent 60%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#06100de8;backdrop-filter:blur(20px);z-index:30}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),#5bcf99);display:grid;place-items:center;color:#082017;font-weight:950}.brand small{font-size:12px;color:#6e837a}.topright,.actions,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.pill,.avatar,.btn{border:1px solid var(--line);background:#0c1915;color:#dbe9e2;border-radius:11px}.pill{padding:8px 12px;font-size:12px}.online{color:var(--mint);border-color:#27523e}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#172a23}.layout{display:flex}.side{width:248px;min-height:calc(100vh - 70px);border-right:1px solid var(--line);padding:18px 12px;position:fixed;top:70px;bottom:0;overflow:auto}.navlabel{font-size:10px;color:#60766c;text-transform:uppercase;letter-spacing:.17em;padding:13px 12px 8px}.nav{width:100%;border:0;background:transparent;color:#8da198;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;text-align:left;margin:2px 0}.nav:hover,.nav.active{background:#13231d;color:#f2faf6}.nav.active{box-shadow:inset 2px 0 var(--mint)}.nav .ico{width:18px;text-align:center}.business-mini{margin:10px 4px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1814}.bizicon{width:42px;height:42px;border-radius:12px;background:#173127;display:grid;place-items:center}.progress,.score{height:7px;background:#162821;border-radius:99px;overflow:hidden}.progress i,.score i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mint2));border-radius:99px}.main{margin-left:248px;width:calc(100% - 248px);max-width:1600px;padding:38px 46px 90px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:30px}.eyebrow{font-size:11px;color:var(--mint2);font-weight:850;text-transform:uppercase;letter-spacing:.18em}.h1{font-size:clamp(38px,5vw,70px);line-height:.95;letter-spacing:-.07em;margin:11px 0 15px}.sub{font-size:16px;line-height:1.65;color:var(--muted);max-width:800px}.btn{padding:11px 15px;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.primary{background:var(--mint);color:#061a12;border-color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card{background:linear-gradient(145deg,#0d1a16,#09140f);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 45px #0002}.stat{font-size:30px;font-weight:850;letter-spacing:-.05em;margin:9px 0}.label{font-size:10px;color:#71877d;text-transform:uppercase;letter-spacing:.12em}.up{font-size:12px;color:var(--mint2)}.muted,.small{color:var(--muted)}.small{font-size:12px;line-height:1.55}.section{display:flex;justify-content:space-between;align-items:end;margin:38px 0 16px}.section h2{margin:0;font-size:21px;letter-spacing:-.035em}.section p{margin:5px 0 0;color:var(--muted);font-size:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.step{padding:14px;border:1px solid var(--line);background:#0d1a16;border-radius:12px}.step b{display:block;margin-bottom:6px}.step span{font-size:11px;color:var(--muted);line-height:1.45}.status,.tag{display:inline-flex;padding:5px 8px;border-radius:99px;background:#173329;color:#9deabd;font-size:10px;font-weight:850;text-transform:uppercase}.status.amber{background:#302817;color:var(--amber)}.status.red{background:#321b1b;color:var(--red)}.metric{display:flex;gap:24px;margin-top:15px;flex-wrap:wrap}.metric b{font-size:17px}.product-photo{height:145px;border-radius:13px;background:radial-gradient(circle at 45% 35%,#3a5b4e,#152820 55%,#0c1713);display:grid;place-items:center;font-size:57px;margin-bottom:15px}.product h3{margin:6px 0 4px;font-size:16px}.price{font-size:23px;font-weight:850;margin-top:8px}.input{width:100%;background:#07110e;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:0}.input:focus{border-color:#4e9c76}.field{margin-bottom:13px}.field label{display:block;font-size:10px;color:#789087;text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}.filterbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:9px;color:#698077;text-transform:uppercase;letter-spacing:.14em}.kpi{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.kpi:last-child{border:0}.choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0a1713;color:#b9c9c1;text-align:left}.choice.selected{border-color:#58a97e;background:#10261d;color:#e9fff1}.hero-banner{padding:25px;border-radius:18px;background:linear-gradient(115deg,#123027,#0b1814);border:1px solid #24463a}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:80}.modal.open{display:grid}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0a1612;border:1px solid #294238;border-radius:21px;padding:25px}.toast{position:fixed;right:22px;bottom:22px;background:#d9ffe8;color:#061a12;padding:13px 16px;border-radius:12px;font-weight:800;display:none;z-index:100}.chat{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow:auto}.bubble{max-width:80%;padding:14px 16px;border:1px solid var(--line);background:#13221d;border-radius:16px;line-height:1.55}.bubble.me{align-self:flex-end;background:var(--mint);color:#061a12;border-color:var(--mint)}.composer{display:flex;gap:8px;margin-top:14px}.asset{padding:17px;border-radius:13px;background:#101f19;border:1px solid var(--line);min-height:105px}.chart{height:220px;display:flex;align-items:end;gap:8px;padding:15px 0}.bar{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#a7e9c1,#2f6750);min-height:12px}.notice{padding:12px 14px;border:1px solid #355247;background:#10221b;border-radius:12px}.danger{border-color:#593636;background:#211313}.calc{font-variant-numeric:tabular-nums}@media(max-width:1000px){.side{display:none}.main{margin:0;width:100%;padding:28px 18px}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.filterbar{grid-template-columns:1fr 1fr}.hero{display:block}.hero .actions{margin-top:18px}.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{padding:0 14px}.brand small,.online{display:none}.filterbar{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.h1{font-size:47px}.main{padding:24px 14px}.card{padding:16px}.table{display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const state={
 page:"home",
 business:null,
 profile:{budget:250000,age:28,income:50000,market:"Bangladesh",category:"Open to anything",experience:"Beginner",goal:"Profit + growth",risk:"Balanced",time:15},
 selectedProduct:null,
 chat:[["ai","I’m your AI co-founder. Tell me your capital, income, age, skills, interests and target. I’ll translate that into practical Bangladesh-market decisions."]]
};
const navItems=[
 ["home","⌂","Overview"],["advisor","✦","AI Advisor"],["ideas","◈","Business Finder"],["products","□","Product Lab"],["orders","↗","Sourcing & Orders"],["brand","✺","Brand Studio"],["store","▱","Store Launch"],["marketing","◎","AI Marketing"],["support","◌","AI Customer Support"],["analytics","⌁","Analytics & Decisions"]
];
const BDT=n=>"৳"+Number(n||0).toLocaleString("en-BD");
const pct=n=>Math.round(n)+"%";
function nav(){return navItems.map(x=>'<button class="nav '+(state.page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')"><span class="ico">'+x[1]+"</span>"+x[2]+"</button>").join("")}
function shell(c){let b=state.business;return '<header class="top"><div class="brand"><div class="mark">F</div>FORGE <small>AI BUSINESS OS</small></div><div class="topright"><span class="pill online">● AI is online</span><button class="pill" onclick="openWizard()">＋ New business</button><div class="avatar">M</div></div></header><div class="layout"><aside class="side"><div class="navlabel">Business workspace</div>'+nav()+'<div class="navlabel" style="margin-top:18px">Your business</div><div class="business-mini"><div class="row"><div class="bizicon">◈</div><div><b>'+(b?b.name:"No business yet")+'</b><div class="small">'+(b?"AI plan · active":"Start your first venture")+'</div></div></div><div class="progress" style="margin-top:12px"><i style="width:'+(b?68:0)+'%"></i></div></div></aside><main class="main">'+c+'</main></div>'}
function home(){let b=state.business;return '<div class="hero"><div><div class="eyebrow">AI operating team</div><div class="h1">Build a business.<br>Not a pile of tasks.</div><div class="sub">Forge turns your personal profile and business goals into opportunity discovery, product economics, sourcing, brand, store, marketing, support and decisions. Built for practical entrepreneurs—not fantasy spreadsheets.</div></div><div class="actions"><button class="btn primary" onclick="openWizard()">Start a new business →</button><button class="btn" onclick="go(\'ideas\')">Find an opportunity</button></div></div>'+
'<div class="hero-banner"><div class="grid"><div class="span7"><div class="eyebrow">How Forge thinks</div><h2 style="font-size:28px;letter-spacing:-.04em;margin:8px 0">Fit first. Economics second. Execution always.</h2><div class="small">Forge considers capital, income, age, market, category, experience, time and risk before ranking an idea. Estimates are conservative planning ranges, not guaranteed results.</div></div><div class="span5"><div class="steps"><div class="step"><b>01 · Profile</b><span>Understand your constraints.</span></div><div class="step"><b>02 · Opportunity</b><span>Rank realistic business models.</span></div><div class="step"><b>03 · Economics</b><span>Model price, cost, CAC and break-even.</span></div><div class="step"><b>04 · Operate</b><span>Turn approvals into actions.</span></div></div></div></div></div>'+
'<div class="section"><div><h2>'+(b?b.name:"Command center")+"</h2><p>"+(b?"Your plan is personalized to your profile.":"Create a profile to activate your operating system.")+'</p></div><button class="btn" onclick="go(\'advisor\')">Ask your AI →</button></div>'+
'<div class="grid"><div class="card span3"><div class="label">Business health</div><div class="stat">'+(b?"84 / 100":"—")+'</div><div class="up">'+(b?"↑ 6.8% this week":"Not calculated yet")+'</div></div><div class="card span3"><div class="label">Capital to deploy</div><div class="stat">'+(b?BDT(b.budget):"—")+'</div><div class="small">Includes a protected testing reserve.</div></div><div class="card span3"><div class="label">Target gross margin</div><div class="stat">'+(b?b.targetMargin+"%":"—")+'</div><div class="small">Category economics, not a promise.</div></div><div class="card span3"><div class="label">AI actions</div><div class="stat">'+(b?"18":"0")+'</div><div class="up">'+(b?"6 need approval":"Create your venture")+'</div></div></div>'+
'<div class="section"><div><h2>Everything is connected</h2><p>Each decision updates the downstream numbers.</p></div></div><div class="grid">'+[["Business strategy","Capital → customer → offer → channel → operating model."],["Product intelligence","Demand, competition, landed cost, pricing, margin, MOQ and complexity."],["Procurement","Supplier shortlist, purchase quantities, cash commitment, QC and lead time."],["Brand + store","Positioning, product copy, merchandising, policies and conversion assets."],["Growth","Creative testing, CAC, ROAS, contribution margin and budget allocation."],["Customer operations","FAQ, order questions, policy handling and human escalation."]].map(x=>'<div class="card span4"><b>'+x[0]+'</b><p class="small">'+x[1]+"</p></div>").join("")+"</div>"}
function openWizard(){let s=1,d={...state.profile};const renderWizard=()=>{document.getElementById("modalbox").innerHTML=`<div><div class="row" style="justify-content:space-between"><div><div class="eyebrow">New venture</div><h2 style="margin:6px 0">Build around the entrepreneur.</h2><div class="small">No jargon. Give Forge the constraints and it will do the business math.</div></div><button class="btn" onclick="closeModal()">✕</button></div><div class="progress" style="margin:18px 0"><i style="width:${s*25}%"></i></div>${wizardStep(s,d)}<div class="actions" style="justify-content:flex-end;margin-top:22px">${s>1?'<button class="btn" onclick="s--;renderWizard()">← Back</button>':""}<button class="btn primary" onclick="${s<4?"s++;captureWizard();renderWizard()":"finishWizard()"}">${s<4?"Continue →":"Build my business →"}</button></div></div>`;};window.captureWizard=()=>{["budget","age","income","market","category","goal","risk","time"].forEach(k=>{let e=document.getElementById("w"+k);if(e)d[k]=e.type==="number"?Number(e.value):e.value});state.profile={...state.profile,...d}};window.finishWizard=()=>{captureWizard();let margin=categoryMargin(d.category);state.business={name:businessName(d.category),budget:d.budget,market:d.market,category:d.category,age:d.age,income:d.income,goal:d.goal,risk:d.risk,time:d.time,targetMargin:margin};state.profile={...state.profile,...d};closeModal();state.page="ideas";render();toast("Business profile built — opportunities ranked")};document.getElementById("modal").classList.add("open");renderWizard()}
function wizardStep(s,d){if(s===1)return '<h3>1. Your money & market</h3><div class="grid"><div class="span6 field"><label>Available capital</label><select class="input" id="wbudget"><option value="100000">৳1–2 lakh</option><option value="250000" selected>৳2–5 lakh</option><option value="500000">৳5–10 lakh</option><option value="1000000">৳10 lakh+</option></select></div><div class="span6 field"><label>Primary market</label><select class="input" id="wmarket"><option>Bangladesh</option><option>India</option><option>UAE</option><option>Saudi Arabia</option><option>USA</option></select></div></div>';if(s===2)return '<h3>2. Your personal operating profile</h3><div class="grid"><div class="span6 field"><label>Age</label><input class="input" id="wage" type="number" value="'+d.age+'"></div><div class="span6 field"><label>Monthly personal income</label><input class="input" id="wincome" type="number" value="'+d.income+'"></div><div class="span6 field"><label>Business experience</label><select class="input" id="wexperience"><option>Beginner</option><option>Some experience</option><option>Experienced</option></select></div><div class="span6 field"><label>Hours/week available</label><input class="input" id="wtime" type="number" value="'+d.time+'"></div></div>';if(s===3)return '<h3>3. What should Forge optimize?</h3><div class="grid"><div class="span6 field"><label>Category</label><select class="input" id="wcategory"><option>Open to anything</option><option>Fashion & accessories</option><option>Beauty & personal care</option><option>Home & living</option><option>Electronics</option><option>Food & beverage</option><option>Sports & fitness</option></select></div><div class="span6 field"><label>Main goal</label><select class="input" id="wgoal"><option>Profit + growth</option><option>Low-risk side income</option><option>Long-term brand</option><option>Fastest revenue</option></select></div></div>';return '<h3>4. Risk & execution</h3><div class="grid"><div class="span6 field"><label>Risk appetite</label><select class="input" id="wrisk"><option>Conservative</option><option selected>Balanced</option><option>Aggressive</option></select></div><div class="span6 field"><label>Hours/week</label><input class="input" id="wtime" type="number" value="'+d.time+'"></div></div><div class="notice"><b>What happens next</b><p class="small">Forge will score business models, estimate startup allocation, suggest products, calculate unit economics, set a first-batch quantity and create the first 30-day operating plan.</p></div>'}
function categoryMargin(c){return ({["Fashion & accessories"]:43,["Beauty & personal care"]:48,["Home & living"]:46,Electronics:28,["Food & beverage"]:35,["Sports & fitness"]:40})[c]||43}
function businessName(c){return ({["Fashion & accessories"]:"Northstar Goods",["Beauty & personal care"]:"Nura Labs",["Home & living"]:"Hearth & Form",Electronics:"Circuit Lane",["Food & beverage"]:"Daily Harvest Co.",["Sports & fitness"]:"Motion Supply"})[c]||"Northstar Ventures"}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function ideas(){let ps=opportunities();return '<div class="hero"><div><div class="eyebrow">Business finder</div><div class="h1">Find what fits you.</div><div class="sub">The ranking changes when your capital, income, time, category, risk or target changes. The numbers below are planning estimates for Bangladesh—not guaranteed returns.</div></div><button class="btn primary" onclick="openWizard()">Edit my profile</button></div><div class="card"><div class="filterbar"><div class="field"><label>Capital</label><select class="input" id="fbudget" onchange="applyFilters()"><option value="100000">৳1–2 lakh</option><option value="250000">৳2–5 lakh</option><option value="500000">৳5–10 lakh</option><option value="1000000">৳10 lakh+</option></select></div><div class="field"><label>Category</label><select class="input" id="fcat" onchange="applyFilters()"><option>Open to anything</option><option>Fashion & accessories</option><option>Beauty & personal care</option><option>Home & living</option><option>Electronics</option><option>Sports & fitness</option></select></div><div class="field"><label>Risk</label><select class="input" id="frisk" onchange="applyFilters()"><option>Conservative</option><option selected>Balanced</option><option>Aggressive</option></select></div><div class="field"><label>Weekly time</label><input class="input" id="ftime" type="number" value="'+state.profile.time+'" oninput="applyFilters()"></div></div></div><div class="section"><div><h2>Ranked opportunities</h2><p>Fit score combines capital fit, category economics, complexity, risk and time.</p></div></div><div class="grid">'+ps.map((p,i)=>'<div class="card span4"><div class="row" style="justify-content:space-between"><span class="tag">#'+(i+1)+" · "+p.fit+"% fit</span><span class="status "+(p.risk==="Medium"?"amber":"")+"">"+p.risk+" risk</span></div><div class="product-photo">"+p.icon+"</div><h3 style="font-size:18px">"+p.name+'</h3><div class="small">'+p.thesis+"</div><div class="metric"><span><div class="label">Gross margin</div><b>"+p.margin+"%</b></span><span><div class="label">Start capital</div><b>"+BDT(p.cap)+"</b></span><span><div class="label">Break-even</div><b>"+p.bep+" units</b></span></div><div style="margin-top:14px"><div class="label">AI score</div><div class="score"><i style="width:"+p.fit+"%"></i></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="selectOpportunity('"+p.name.replace(/'/g,"\\'")+"')">Build this business →</button></div>").join("")+"</div>"}
function applyFilters(){state.profile.budget=Number(document.getElementById("fbudget").value);state.profile.category=document.getElementById("fcat").value;state.profile.risk=document.getElementById("frisk").value;state.profile.time=Number(document.getElementById("ftime").value)||15;render()}
function opportunities(){let cat=state.profile.category,b=state.profile.budget,t=state.profile.time,r=state.profile.risk;let base=[["Premium carry goods","👜","Everyday bags and small accessories; manageable SKUs and strong room for brand differentiation.",46,210000,"Low",94,180],["Urban footwear","👟","Fashion footwear with higher AOV; needs size management and tighter QC.",42,280000,"Medium",91,150],["Home fragrance","🕯️","Compact, giftable products with repeat-purchase potential and relatively simple logistics.",51,140000,"Low",89,210],["Modern watches","⌚","Accessible premium watches where design and presentation drive differentiation.",39,230000,"Medium",86,160],["Everyday beauty","🧴","Personal-care products with repeat potential; compliance and formulation quality matter.",48,180000,"Medium",84,190],["Functional travel gear","🎒","Useful bags and organizers for commuters/travelers with moderate SKU complexity.",44,190000,"Low",82,175]];let filtered=base;if(cat!=="Open to anything")filtered=base.filter(p=>({"Fashion & accessories":["Premium carry goods","Urban footwear","Modern watches"],"Beauty & personal care":["Everyday beauty"],"Home & living":["Home fragrance"],Electronics:[],["Sports & fitness"]:["Functional travel gear"]}[cat]||[]).includes(p[0]));return filtered.map(p=>{let fit=p[6];if(b<p[4])fit-=12;if(b>p[4]*2)fit+=3;if(t<10&&p[5]==="Medium")fit-=8;if(r==="Conservative"&&p[5]==="Medium")fit-=7;if(r==="Aggressive")fit+=3;return {name:p[0],icon:p[1],thesis:p[2],margin:p[3],cap:p[4],risk:p[5],fit:Math.max(55,Math.min(97,fit)),bep:p[7]}}).sort((a,b)=>b.fit-a.fit)}
function selectOpportunity(name){let p=opportunities().find(x=>x.name===name)||opportunities()[0];state.selectedProduct=p;state.business={...(state.business||{}),name:name,budget:state.profile.budget,market:state.profile.market,category:state.profile.category,targetMargin:p.margin};state.chat.push(["ai","Great choice: "+name+". I’ve connected it to your profile. Open Product Lab to model price, landed cost, contribution margin and first-batch quantity."]);state.page="products";render();toast(name+" added to your business plan")}
function products(){let p=state.selectedProduct||opportunities()[0];let sell=Math.round((p.cap/Math.max(1,Math.round(p.cap/90000)))*2.35);if(p.name==="Premium carry goods")sell=2490;if(p.name==="Urban footwear")sell=3290;if(p.name==="Home fragrance")sell=1590;if(p.name==="Modern watches")sell=3990;if(p.name==="Everyday beauty")sell=1290;let landed=Math.round(sell*(1-p.margin/100)*.62);let ad=260,fees=Math.round(sell*.025),contrib=sell-landed-ad-fees;return '<div class="hero"><div><div class="eyebrow">Product lab</div><div class="h1">Every product has to survive the math.</div><div class="sub">Change price, landed cost, CAC or quantity. Forge immediately shows gross margin, contribution margin, break-even and cash requirement.</div></div><button class="btn" onclick="go(\'orders\')">Open procurement →</button></div><div class="grid"><div class="card span7"><div class="row" style="justify-content:space-between"><div><span class="tag">Recommended hero product</span><h2 style="margin:10px 0">'+p.name+"</h2><p class="small">"+p.thesis+"</p></div><div style="font-size:60px">"+p.icon+"</div></div><div class="grid" style="margin-top:18px"><div class="span6 field"><label>Selling price (BDT)</label><input class="input calc" id="calcprice" type="number" value=""+sell+"" oninput="recalc()"></div><div class="span6 field"><label>Landed cost/unit</label><input class="input calc" id="calccost" type="number" value=""+landed+"" oninput="recalc()"></div><div class="span6 field"><label>Customer acquisition cost</label><input class="input calc" id="calccac" type="number" value=""+ad+"" oninput="recalc()"></div><div class="span6 field"><label>Payment + variable fees %</label><input class="input calc" id="calcfee" type="number" value="2.5" step=".1" oninput="recalc()"></div></div></div><div class="card span5"><div class="label">Live unit economics</div><div class="stat" id="gm">'+pct((sell-landed)/sell*100)+" gross margin</div><div class="kpi"><span>Contribution / unit</span><b id="cm">"+BDT(contrib)+"</b></div><div class="kpi"><span>Contribution margin</span><b id="cmp">"+pct(contrib/sell*100)+"</b></div><div class="kpi"><span>Suggested first batch</span><b>"+p.bep+" units</b></div><div class="kpi"><span>Inventory cash</span><b>"+BDT(landed*p.bep)+"</b></div><button class="btn primary" style="margin-top:15px" onclick="toast('Product economics approved')">Approve economics</button></div></div><div class="section"><div><h2>Recommended catalog</h2><p>Start narrow. Prove demand. Reorder winners.</p></div><button class="btn" onclick="toast('Supplier research queued')">Find suppliers</button></div><div class="grid">'+opportunities().slice(0,6).map(x=>'<div class="card span4"><div class="row"><span class="tag">'+x.fit+"% fit</span><span class="status">"+x.margin+"% margin</span></div><div style="font-size:40px;margin:12px 0">"+x.icon+"</div><b>"+x.name+"</b><p class="small">First-batch range: "+Math.round(x.bep*.7)+"–"+Math.round(x.bep*1.2)+" units · estimated capital "+BDT(x.cap)+"</p><button class="btn" onclick="selectOpportunity('"+x.name+"')">Model this →</button></div>").join("")+"</div>"}
function recalc(){let price=+document.getElementById("calcprice").value||0,cost=+document.getElementById("calccost").value||0,cac=+document.getElementById("calccac").value||0,fee=(+document.getElementById("calcfee").value||0)/100;let gross=price-cost,contrib=price-cost-cac-price*fee;document.getElementById("gm").textContent=pct(price?gross/price*100:0)+" gross margin";document.getElementById("cm").textContent=BDT(contrib);document.getElementById("cmp").textContent=pct(price?contrib/price*100:0)}
function orders(){let b=state.business||{budget:250000};let reserve=Math.round(b.budget*.22),stock=Math.round(b.budget*.55),marketing=Math.round(b.budget*.15),ops=b.budget-reserve-stock-marketing;return '<div class="hero"><div><div class="eyebrow">Sourcing & orders</div><div class="h1">Procurement with cash discipline.</div><div class="sub">Forge protects a reserve, separates inventory cash from marketing cash and makes purchase approvals explicit.</div></div><button class="btn primary" onclick="go('products')">Source a product</button></div><div class="grid"><div class="card span3"><div class="label">Available capital</div><div class="stat">'+BDT(b.budget)+'</div></div><div class="card span3"><div class="label">Inventory envelope</div><div class="stat">'+BDT(stock)+'</div><div class="small">≈55% planning allocation</div></div><div class="card span3"><div class="label">Testing reserve</div><div class="stat">'+BDT(reserve)+'</div><div class="small">Kept for uncertainty</div></div><div class="card span3"><div class="label">Growth + ops</div><div class="stat">'+BDT(marketing+ops)+'</div></div></div><div class="section"><div><h2>Purchase orders</h2><p>Illustrative Bangladesh import/local procurement workflow.</p></div></div><div class="card"><table class="table"><thead><tr><th>PO</th><th>Product</th><th>Units</th><th>Landed cost</th><th>Cash</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>#F-1048</td><td>Hero product</td><td>180</td><td>'+BDT(landedCost())+'</td><td>'+BDT(180*landedCost())+'</td><td><span class="status amber">Draft</span></td><td><button class="btn" onclick="toast('PO sent for approval')">Approve</button></td></tr><tr><td>#F-1042</td><td>Sample batch</td><td>20</td><td>'+BDT(Math.round(landedCost()*1.12))+'</td><td>'+BDT(20*Math.round(landedCost()*1.12))+'</td><td><span class="status">QC</span></td><td><button class="btn" onclick="toast('QC checklist opened')">Inspect</button></td></tr></tbody></table></div><div class="section"><h2>Procurement workflow</h2></div><div class="grid">'+[["1 · Supplier shortlist","Compare MOQ, unit cost, lead time, defect policy and payment terms."],["2 · Sample + QC","Approve sample quality before committing the first commercial batch."],["3 · Landed economics","Include freight, duties/taxes where applicable, packaging and local handling."],["4 · Reorder trigger","Reorder only after sell-through and contribution margin validate the product."]].map(x=>'<div class="card span3"><b>'+x[0]+"</b><p class="small">"+x[1]+"</p></div>").join("")+"</div>"}
function landedCost(){let p=state.selectedProduct||opportunities()[0];return Math.round((p.name==="Urban footwear"?1480:p.name==="Premium carry goods"?1120:p.name==="Home fragrance"?620:p.name==="Modern watches"?1760:p.name==="Everyday beauty"?540:890))}
function brand(){let b=state.business||{name:"Northstar Ventures"};return '<div class="hero"><div><div class="eyebrow">Brand studio</div><div class="h1">One business thesis. One brand.</div><div class="sub">Forge turns the selected customer and product economics into positioning, voice, product storytelling and a usable launch kit.</div></div><button class="btn primary" onclick="toast('Brand direction regenerated')">Generate direction</button></div><div class="grid"><div class="card span8"><div style="height:260px;border-radius:14px;background:linear-gradient(135deg,#dff5e7,#82b99e);color:#071b12;padding:28px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font-size:11px;letter-spacing:.22em">'+b.name.toUpperCase()+"</div><div style="font-size:48px;font-weight:850;letter-spacing:-.07em;line-height:.95">"+(b.category==="Fashion & accessories"?"Carry less. Go further.":"Useful things, made better.")+"</div></div></div><div class="card span4"><div class="label">Brand readiness</div><div class="stat">86%</div><div class="progress"><i style="width:86%"></i></div><div class="kpi"><span>Positioning</span><b>Done</b></div><div class="kpi"><span>Voice</span><b>Done</b></div><div class="kpi"><span>Catalog</span><b>Ready</b></div><div class="kpi"><span>Packaging</span><b>Next</b></div></div></div><div class="section"><h2>Assets you can generate</h2></div><div class="grid">'+[["Positioning","Customer, problem, promise and proof."],["Naming","Business, collection and product names."],["Product copy","Benefit-led copy with Bangladesh-relevant pricing context."],["Packaging","Box, insert, label and care/policy copy."],["Social system","Hooks, captions, UGC scripts and creative briefs."],["Store merchandising","Collection structure, bundles and trust blocks."]].map(x=>'<div class="asset span4"><b>'+x[0]+'</b><p class="small">'+x[1]+'</p><button class="btn" onclick="toast(\''+x[0]+' generated\')">Generate →</button></div>').join("")+"</div>"}
function store(){return '<div class="hero"><div><div class="eyebrow">Store launch</div><div class="h1">From product economics to checkout.</div><div class="sub">The launch checklist is connected to your business plan. Pricing, catalog, policies, analytics and customer support should agree with each other.</div></div><button class="btn primary" onclick="toast('Store preview opened')">Preview store ↗</button></div><div class="card"><div class="row" style="justify-content:space-between"><div><b>'+((state.business&&state.business.name)||"Your business").toLowerCase().replace(/ /g,"")+'.store</b><div class="small">Mobile-first · Conversion focused</div></div><span class="status">72% ready</span></div><div class="progress" style="margin:18px 0"><i style="width:72%"></i></div></div><div class="section"><h2>Launch checklist</h2></div><div class="grid">'+["Hero product approved","Pricing + margin checked","Product photography","Descriptions + SEO","Payment methods","Delivery / COD rules","Return & exchange policy","Analytics + pixels","WhatsApp / chat","Order notifications","Trust blocks","Launch campaign"].map((x,i)=>'<div class="card span3"><div class="row" style="justify-content:space-between"><b>'+x+'</b><span class="status '+(i>7?"amber":"")+'">'+(i<8?"Done":"Next")+"</span></div><p class="small">AI checklist with human approval where money, policy or customer trust is involved.</p></div>").join("")+"</div>"}
function marketing(){return '<div class="hero"><div><div class="eyebrow">AI growth loop</div><div class="h1">Spend based on contribution, not vanity.</div><div class="sub">Forge separates ROAS from real contribution margin and recommends scaling only when the economics support it.</div></div><button class="btn primary" onclick="toast('Growth analysis refreshed')">Run growth analysis →</button></div><div class="grid"><div class="card span3"><div class="label">Monthly ad budget</div><div class="stat">'+BDT(Math.round((state.business?.budget||250000)*.15))+'</div></div><div class="card span3"><div class="label">Target CAC</div><div class="stat">৳320</div><div class="small">Planning ceiling</div></div><div class="card span3"><div class="label">Target ROAS</div><div class="stat">3.2×</div><div class="small">Depends on margin</div></div><div class="card span3"><div class="label">Creative tests</div><div class="stat">12</div><div class="up">6 hypotheses ready</div></div></div><div class="section"><h2>Campaign desk</h2></div><div class="card"><table class="table"><thead><tr><th>Campaign</th><th>Channel</th><th>Budget</th><th>ROAS</th><th>Contribution</th><th>AI action</th></tr></thead><tbody><tr><td>Hero product launch</td><td>Meta</td><td>৳12,000</td><td>3.8×</td><td>Healthy</td><td><span class="status">Scale 15%</span></td></tr><tr><td>UGC test</td><td>Meta</td><td>৳7,000</td><td>2.4×</td><td>Watch</td><td><span class="status amber">Iterate</span></td></tr><tr><td>Retargeting</td><td>Meta</td><td>৳5,000</td><td>4.1×</td><td>Strong</td><td><span class="status">Keep</span></td></tr></tbody></table></div><div class="section"><h2>Creative factory</h2></div><div class="grid">'+["3-second hook","Problem/solution reel","UGC script","Founder story","Offer creative","Retargeting creative"].map(x=>'<div class="asset span4"><b>'+x+'</b><p class="small">Generate 5 variants, then test one variable at a time.</p><button class="btn" onclick="toast(\''+x+' brief generated\')">Generate →</button></div>').join("")+"</div>"}
function support(){return '<div class="hero"><div><div class="eyebrow">AI customer support</div><div class="h1">Fast answers. Safe escalation.</div><div class="sub">Forge can handle routine product, delivery and policy questions, while sensitive cases stay visible to a human.</div></div></div><div class="grid"><div class="card span4"><div class="label">Conversations today</div><div class="stat">84</div><div class="up">96% routine resolution</div></div><div class="card span4"><div class="label">Median response</div><div class="stat">11 sec</div><div class="up">24/7 coverage</div></div><div class="card span4"><div class="label">Human escalations</div><div class="stat">3</div><div class="up">Context preserved</div></div></div><div class="section"><h2>Support queue</h2></div><div class="card">'+[["Do you have size 42?","Catalog availability","Resolved"],["When will my parcel arrive?","Order tracking","Resolved"],["Can I exchange this size?","Policy","Resolved"],["Wrong item received.","Order issue · evidence required","Needs you"],["I want a refund for change of mind.","Policy","Needs you"]].map(x=>'<div class="kpi"><span><b>'+x[0]+'</b><div class="small">'+x[1]+"</div></span><span class="status "+(x[2]==="Needs you"?"amber":"")+"">"+x[2]+"</span></div>").join("")+'</div><div class="notice" style="margin-top:15px"><b>Safety rule:</b> AI should not invent stock, delivery dates, refunds or policy exceptions. It should escalate when the business data is missing.</div>'}
function analytics(){let b=state.business||{budget:250000,targetMargin:43};return '<div class="hero"><div><div class="eyebrow">Decision intelligence</div><div class="h1">Numbers that lead to decisions.</div><div class="sub">Forge uses a simple operating scorecard: demand, unit economics, cash efficiency, customer experience, inventory risk and marketing efficiency.</div></div><button class="btn" onclick="toast('Decision model refreshed')">Refresh model ↻</button></div><div class="grid"><div class="card span8"><div class="label">Illustrative revenue trajectory</div><div class="chart">'+[32,41,38,55,63,71,86].map(h=>'<div class="bar" style="height:'+h+'%"></div>').join("")+'</div><div class="small">Indexed planning view. Connect actual sales data before using for financial decisions.</div></div><div class="card span4"><div class="label">AI business verdict</div><h2 style="margin:9px 0">Validate before scaling.</h2><p class="small">Keep the first batch small enough to learn. Scale only when contribution margin remains positive after acquisition, delivery, payment fees and expected returns.</p><button class="btn primary" onclick="go('products')">Review unit economics</button></div></div><div class="section"><h2>Scorecard</h2></div><div class="grid">'+[["Demand",92,"Strong"],["Unit economics",88,"Healthy"],["Cash efficiency",73,"Watch"],["Customer experience",95,"Strong"],["Inventory risk",68,"Watch"],["Marketing efficiency",84,"Healthy"]].map(x=>'<div class="card span4"><div class="row" style="justify-content:space-between"><b>'+x[0]+'</b><span class="status '+(x[2]==="Watch"?"amber":"")+'">'+x[2]+"</span></div><div class="stat">"+x[1]+'</div><div class="score"><i style="width:'+x[1]+'%"></i></div></div>').join("")+"</div><div class="section"><h2>Financial guardrails</h2></div><div class="grid"><div class="card span4"><div class="label">Protected reserve</div><div class="stat">22%</div><p class="small">Do not deploy all available capital into inventory on day one.</p></div><div class="card span4"><div class="label">Target gross margin</div><div class="stat">'+b.targetMargin+'%</div><p class="small">Category-dependent planning target.</p></div><div class="card span4"><div class="label">Break-even rule</div><div class="stat">Contribution &gt; 0</div><p class="small">Revenue alone is not profitability.</p></div></div>'}
function advisor(){return '<div class="hero"><div><div class="eyebrow">AI co-founder</div><div class="h1">Ask anything about the business.</div><div class="sub">Use plain language. Forge answers using your current profile, selected product and operating assumptions.</div></div></div><div class="grid"><div class="card span8"><div class="chat" id="chat">'+state.chat.map(m=>'<div class="bubble '+(m[0]==="me"?"me":"")+'">'+m[1]+"</div>").join("")+'</div><div class="composer"><input class="input" id="chatInput" placeholder="e.g. I have ৳2 lakh. What can I sell?" onkeydown="if(event.key===\'Enter\')sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div><div class="card span4"><div class="label">Current context</div><div class="kpi"><span>Capital</span><b>'+BDT(state.profile.budget)+"</b></div><div class="kpi"><span>Market</span><b>"+state.profile.market+"</b></div><div class="kpi"><span>Category</span><b>"+state.profile.category+"</b></div><div class="kpi"><span>Risk</span><b>"+state.profile.risk+"</b></div><div class="kpi"><span>Time</span><b>"+state.profile.time+"h/week</b></div></div></div><div class="section"><h2>Quick commands</h2></div><div class="actions">'+["Find my best products","Build a 30-day launch plan","Calculate my break-even","What is my biggest risk?","How much should I spend on ads?"].map(x=>'<button class="btn" onclick="quick(\''+x+'\')">'+x+"</button>").join("")+"</div>"}
function sendChat(){let i=document.getElementById("chatInput"),v=i.value.trim();if(!v)return;state.chat.push(["me",v]);state.chat.push(["ai",answer(v)]);render();setTimeout(()=>{let e=document.getElementById("chat");e?.lastElementChild?.scrollIntoView({behavior:"smooth"})},20)}
function quick(v){let i=document.getElementById("chatInput");if(i){i.value=v;sendChat()}else{state.chat.push(["me",v],["ai",answer(v)]);render()}}
function answer(v){let s=v.toLowerCase(),p=state.selectedProduct||opportunities()[0],b=state.business||{budget:state.profile.budget};if(s.includes("product")||s.includes("sell"))return "Based on your current profile, I would start with "+p.name+". The reason is the balance between roughly "+p.margin+"% gross margin, "+BDT(p.cap)+" planning capital and "+p.risk.toLowerCase()+" execution risk. I would validate a small first batch before committing the full budget.";if(s.includes("break"))return "For the current model, break-even should be based on contribution per unit—not sales. Enter selling price, landed cost, CAC and variable fees in Product Lab; fixed launch costs can then be divided by contribution per unit.";if(s.includes("ads")||s.includes("marketing"))return "For a first launch, I’d keep paid acquisition around 10–15% of available capital as a planning envelope, not an automatic spend. Start small, watch contribution after CAC and returns, then scale winners.";if(s.includes("risk"))return "Your biggest early risk is inventory commitment before demand validation. Keep a reserve, sample first, launch a small hero catalog, set a reorder threshold and do not confuse high ROAS with high profit.";if(s.includes("30")||s.includes("launch"))return "Days 1–7: validate customer and 3–5 products. Days 8–14: sample/QC, pricing, brand and store. Days 15–21: launch controlled creative tests. Days 22–30: cut weak SKUs, improve conversion, reorder only proven winners.";return "I can help with opportunity selection, product economics, sourcing, branding, store launch, marketing, customer support and business decisions. Ask me for a number or a next action and I’ll make the assumption visible."}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",2500)}
function render(){let pages={home,advisor,ideas,products,orders,brand,store,marketing,support,analytics};document.getElementById("app").innerHTML=shell(pages[state.page]())}
render();
</script>
