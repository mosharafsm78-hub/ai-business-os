und:#0b1814}.bizicon{width:42px;height:42px;border-radius:12px;background:#173127;display:grid;place-items:center}.progress,.score{height:7px;background:#162821;border-radius:99px;overflow:hidden}.progress i,.score i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mint2));border-radius:99px}.main{margin-left:248px;width:calc(100% - 248px);max-width:1600px;padding:38px 46px 90px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:30px}.eyebrow{font-size:11px;color:var(--mint2);font-weight:850;text-transform:uppercase;letter-spacing:.18em}.h1{font-size:clamp(38px,5vw,70px);line-height:.95;letter-spacing:-.07em;margin:11px 0 15px}.sub{font-size:16px;line-height:1.65;color:var(--muted);max-width:800px}.btn{padding:11px 15px;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.primary{background:var(--mint);color:#061a12;border-color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card{background:linear-gradient(145deg,#0d1a16,#09140f);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 45px #0002}.stat{font-size:30px;font-weight:850;letter-spacing:-.05em;margin:9px 0}.label{font-size:10px;color:#71877d;text-transform:uppercase;letter-spacing:.12em}.up{font-size:12px;color:var(--mint2)}.muted,.small{color:var(--muted)}.small{font-size:12px;line-height:1.55}.section{display:flex;justify-content:space-between;align-items:end;margin:38px 0 16px}.section h2{margin:0;font-size:21px;letter-spacing:-.035em}.section p{margin:5px 0 0;color:var(--muted);font-size:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.step{padding:14px;border:1px solid var(--line);background:#0d1a16;border-radius:12px}.step b{display:block;margin-bottom:6px}.step span{font-size:11px;color:var(--muted);line-height:1.45}.status,.tag{display:inline-flex;padding:5px 8px;border-radius:99px;background:#173329;color:#9deabd;font-size:10px;font-weight:850;text-transform:uppercase}.status.amber{background:#302817;color:var(--amber)}.status.red{background:#321b1b;color:var(--red)}.metric{display:flex;gap:24px;margin-top:15px;flex-wrap:wrap}.metric b{font-size:17px}.product-photo{height:145px;border-radius:13px;background:radial-gradient(circle at 45% 35%,#3a5b4e,#152820 55%,#0c1713);display:grid;place-items:center;font-size:57px;margin-bottom:15px}.product h3{margin:6px 0 4px;font-size:16px}.price{font-size:23px;font-weight:850;margin-top:8px}.input{width:100%;background:#07110e;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:0}.input:focus{border-color:#4e9c76}.field{margin-bottom:13px}.field label{display:block;font-size:10px;color:#789087;text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}.filterbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:9px;color:#698077;text-transform:uppercase;letter-spacing:.14em}.kpi{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.kpi:last-child{border:0}.choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0a1713;color:#b9c9c1;text-align:left}.choice.selected{border-color:#58a97e;background:#10261d;color:#e9fff1}.hero-banner{padding:25px;border-radius:18px;background:linear-gradient(115deg,#123027,#0b1814);border:1px solid #24463a}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:80}.modal.open{display:grid}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0a1612;border:1px solid #294238;border-radius:21px;padding:25px}.toast{position:fixed;right:22px;bottom:22px;background:#d9ffe8;color:#061a12;padding:13px 16px;border-radius:12px;font-weight:800;display:none;z-index:100}.chat{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow:auto}.bubble{max-width:80%;padding:14px 16px;border:1px solid var(--line);background:#13221d;border-radius:16px;line-height:1.55}.bubble.me{align-self:flex-end;background:var(--mint);color:#061a12;border-color:var(--mint)}.composer{display:flex;gap:8px;margin-top:14px}.asset{padding:17px;border-radius:13px;background:#101f19;border:1px solid var(--line);min-height:105px}.chart{height:220px;display:flex;align-items:end;gap:8px;padding:15px 0}.bar{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#a7e9c1,#2f6750);min-height:12px}.notice{padding:12px 14px;border:1px solid #355247;background:#10221b;border-radius:12px}.danger{border-color:#593636;background:#211313}.calc{font-variant-numeric:tabular-nums}@media(max-width:1000px){.side{display:none}.main{margin:0;width:100%;padding:28px 18px}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.filterbar{grid-template-columns:1fr 1fr}.hero{display:block}.hero .actions{margin-top:18px}.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{padding:0 14px}.brand small,.online{display:none}.filterbar{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.h1{font-size:47px}.main{padding:24px 14px}.card{padding:16px}.table{display:block;overflow:auto;white-space:nowrap}}

<body>
<div id="app"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const STORAGE_KEY="forge_profile_v3";
const DEFAULT_PROFILE={budget:0,age:0,income:0,expenses:0,reserve:0,market:"Bangladesh",city:"",occupation:"",experience:"Beginner",skills:"",workStyle:"Builder",category:"Open to anything",goal:"Profit + growth",risk:"Balanced",riskCapacity:"Medium",lossTolerance:0,time:0,targetIncome:0,model:"Open to recommendations"};
let saved=null;try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")}catch(e){}
const state={page:saved?.locked?"home":"onboarding",business:saved?.business||null,profile:saved?.profile||DEFAULT_PROFILE,profileLocked:!!saved?.locked,selectedProduct:null,sourcingQueue:saved?.sourcingQueue||[],chat:[["ai","I am your AI co-founder. Your locked profile is the foundation for every recommendation. I will not change it when ranking businesses or products."]]};
function persistProfile(){localStorage.setItem(STORAGE_KEY,JSON.stringify({locked:true,profile:state.profile,business:state.business}))}
function clearProfileForDemo(){localStorage.removeItem(STORAGE_KEY);location.reload()}

const navItems=[["home","⌂","Overview"],["advisor","✦","AI Advisor"],["ideas","◈","Business Finder"],["products","□","Product Lab"],["plan","▤","Business Plan"],["orders","↗","Sourcing & Orders"],["brand","✺","Brand Studio"],["store","▱","Store Launch"],["marketing","◎","AI Marketing"],["support","◌","AI Customer Support"],["analytics","⌁","Analytics & Decisions"]];
const BDT=n=>"৳"+Number(n||0).toLocaleString("en-BD");
const pct=n=>Math.round(Number(n)||0)+"%";
function nav(){return navItems.map(x=>"<button class='nav "+(state.page===x[0]?"active":"")+"' onclick=\"go('"+x[0]+"')\"><span class='ico'>"+x[1]+"</span>"+x[2]+"</button>").join("")}
function shell(c){let b=state.business;return "<header class='top'><div class='brand'><div class='mark'>F</div>FORGE <small>AI BUSINESS OS</small></div><div class='topright'><span class='pill online'>● AI is online</span><button class='pill' onclick='openWizard()'>＋ New business</button><div class='avatar'>M</div></div></header><button class='corner-tab' onclick='toggleCorner()'>CATEGORIES</button><aside id='cornerPanel' class='corner-panel'><div class='row' style='justify-content:space-between'><div><div class='eyebrow'>Forge workspace</div><h3>Categories & tools</h3><div class='small'>Tap to open. Tap again to close.</div></div><button class='btn' onclick='toggleCorner()'>✕</button></div><div class='navlabel'>Business workflow</div>"+nav()+"</aside><div class='layout'><aside class='side'><div class='navlabel'>Business workspace</div>"+nav()+"<div class='navlabel' style='margin-top:18px'>Your business</div><div class='business-mini'><div class='row'><div class='bizicon'>◈</div><div><b>"+(b?b.name:"No business yet")+"</b><div class='small'>"+(b?"AI plan · active":"Start your first venture")+"</div></div></div><div class='progress' style='margin-top:12px'><i style='width:'+(b?68:0)+'%'></i></div></div></aside><main class='main'>"+c+"</main></div>"}
function toggleCorner(){document.getElementById("cornerPanel").classList.toggle("open")}
function home(){let b=state.business;return "<div class='hero'><div><div class='eyebrow'>AI operating team</div><div class='h1'>Build a business.<br>Not a pile of tasks.</div><div class='sub'>Forge turns your personal profile and business goals into opportunity discovery, product economics, sourcing, brand, store, marketing, support and decisions. Built for practical entrepreneurs—not fantasy spreadsheets.</div></div><div class='actions'><button class='btn primary' onclick='openWizard()'>Start a new business →</button><button class='btn' onclick=\"go('ideas')\">Find an opportunity</button></div></div><div class='hero-banner'><div class='grid'><div class='span7'><div class='eyebrow'>How Forge thinks</div><h2 style='font-size:28px;letter-spacing:-.04em;margin:8px 0'>Fit first. Economics second. Execution always.</h2><div class='small'>Forge considers capital, income, age, market, category, experience, time and risk before ranking an idea. Estimates are conservative planning ranges, not guaranteed results.</div></div><div class='span5'><div class='steps'><div class='step'><b>01 · Profile</b><span>Understand your constraints.</span></div><div class='step'><b>02 · Opportunity</b><span>Rank realistic business models.</span></div><div class='step'><b>03 · Economics</b><span>Model price, cost, CAC and break-even.</span></div><div class='step'><b>04 · Operate</b><span>Turn approvals into actions.</span></div></div></div></div></div><div class='section'><div><h2>"+(b?b.name:"Command center")+"</h2><p>"+(b?"Your plan is personalized to your profile.":"Create a profile to activate your operating system.")+"</p></div><button class='btn' onclick=\"go('advisor')\">Ask your AI →</button></div><div class='grid'><div class='card span3'><div class='label'>Business health</div><div class='stat'>"+(b?"84 / 100":"—")+"</div><div class='up'>"+(b?"↑ 6.8% this week":"Not calculated yet")+"</div></div><div class='card span3'><div class='label'>Capital to deploy</div><div class='stat'>"+(b?BDT(b.budget):"—")+"</div><div class='small'>Includes a protected testing reserve.</div></div><div class='card span3'><div class='label'>Target gross margin</div><div class='stat'>"+(b?b.targetMargin+"%":"—")+"</div><div class='small'>Category economics, not a promise.</div></div><div class='card span3'><div class='label'>AI actions</div><div class='stat'>"+(b?"18":"0")+"</div><div class='up'>"+(b?"6 need approval":"Create your venture")+"</div></div></div><div class='section'><div><h2>Everything is connected</h2><p>Each decision updates the downstream numbers.</p></div></div><div class='grid'>"+[["Business strategy","Capital → customer → offer → channel → operating model."],["Product intelligence","Demand, competition, landed cost, pricing, margin, MOQ and complexity."],["Procurement","Supplier shortlist, purchase quantities, cash commitment, QC and lead time."],["Brand + store","Positioning, product copy, merchandising, policies and conversion assets."],["Growth","Creative testing, CAC, ROAS, contribution margin and budget allocation."],["Customer operations","FAQ, order questions, policy handling and human escalation."]].map(x=>"<div class='card span4'><b>"+x[0]+"</b><p class='small'>"+x[1]+"</p></div>").join("")+"</div>"}
function openWizard(){
 if(state.profileLocked){
  document.getElementById("modalbox").innerHTML="<div><div class='row' style='justify-content:space-between'><div><div class='eyebrow'>Identity locked</div><h2 style='margin:6px 0'>Your Forge profile is fixed.</h2><div class='small'>These inputs control your recommendations. They are not editable from the dashboard.</div></div><button class='btn' onclick='closeModal()'>✕</button></div><div class='locked-profile'>"+profileSummary()+"</div><div class='notice'><b>Why locked?</b><p class='small'>If your real financial or personal situation changes materially, Forge should reassess the profile instead of letting individual recommendations be manipulated.</p></div><div class='actions' style='justify-content:flex-end;margin-top:20px'><button class='btn primary' onclick='closeModal();go(\"ideas\")'>Continue to Business Finder →</button></div></div>";
  document.getElementById("modal").classList.add("open");return;
 }
 let step=1,d={...DEFAULT_PROFILE};
 function draw(){document.getElementById("modalbox").innerHTML="<div><div class='row' style='justify-content:space-between'><div><div class='eyebrow'>Forge onboarding · "+step+" / 5</div><h2 style='margin:6px 0'>Let's understand the entrepreneur first.</h2><div class='small'>No dashboard until this profile is complete. Your answers become locked decision inputs.</div></div></div><div class='progress' style='margin:18px 0'><i style='width:"+(step*20)+"%'></i></div>"+wizardStep(step,d)+"<div class='actions' style='justify-content:flex-end;margin-top:22px'>"+(step>1?"<button class='btn' onclick='wizardBack()'>← Back</button>":"")+"<button class='btn primary' onclick='"+(step<5?"wizardNext()":"finishWizard()")+"'>"+(step<5?"Continue →":"Lock my profile & enter Forge →")+"</button></div></div>"}
 window.wizardBack=()=>{step--;draw()};
 window.wizardNext=()=>{captureWizard();if(!validateWizard(step))return;step++;draw()};
 window.captureWizard=()=>{["budget","age","income","expenses","reserve","market","city","occupation","experience","skills","workStyle","category","goal","risk","riskCapacity","lossTolerance","time","targetIncome","model"].forEach(k=>{let e=document.getElementById("w"+k);if(e)d[k]=e.type==="number"?Number(e.value):e.value})};
 window.validateWizard=(s)=>{let required=s===1?["budget","income","expenses","reserve"]:s===2?["age","city","occupation","time"]:s===3?["risk","riskCapacity","lossTolerance"]:[];for(const k of required){let v=d[k];if((typeof v==="number"&&(v<=0))||(!v&&typeof v!=="number")){toast("Please complete all required fields");return false}}return true};
 window.finishWizard=()=>{captureWizard();if(!validateWizard(5))return;state.profile={...d};state.business={name:businessName(d.category),budget:d.budget,market:d.market,category:d.category,age:d.age,income:d.income,goal:d.goal,risk:d.risk,time:d.time,targetMargin:categoryMargin(d.category),planMode:planMode(d)};state.profileLocked=true;state.page="ideas";persistProfile();closeModal();render();toast("Profile locked — Forge is now personalized to you")};
 document.getElementById("modal").classList.add("open");draw();
}

 const p=state.profile;

 ];

    "<div><h3 style='margin:0 0 8px'>"+esc(p.name)+"</h3><div class='cj-detail-price'>"+moneyUsd(p.priceUsd)+"</div><div class='cj-detail-bdt'>≈ "+BDT(bdtEstimate(p.priceUsd))+" planning estimate · current sourcing cost only</div>"+
    "<div class='cj-data'><div>Category<b>"+esc(p.category)+"</b></div><div>Inventory<b>"+formatQty(p.inventory)+"</b></div><div>SKU / SPU<b>"+esc(p.sku||"—")+"</b></div><div>Delivery<b>"+esc(p.deliveryDays||"Check at order")+"</b></div></div></div></div>"+
    "<div class='cj-order-note'>This step does <b>not</b> place an order with CJ. It saves the selected supplier product into Forge's sourcing queue. Final landed cost, variant, shipping method, customer order and payment are confirmed before any supplier order is created.</div>"+
    "<div class='actions' style='margin-top:16px'><button class='btn primary' onclick='addCjToQueue("+i+")'>Add to sourcing queue →</button><button class='btn' onclick='closeModal()'>Keep browsing</button></div>";
  document.getElementById("modal").classList.add("open");
}

function addCjToQueue(i){
  const p=cjState[i]; if(!p)return;
  state.sourcingQueue=Array.isArray(state.sourcingQueue)?state.sourcingQueue:[];
  const item={...p,selectedAt:new Date().toISOString()};
  const existing=state.sourcingQueue.findIndex(x=>x.id===p.id);
  if(existing>=0) state.sourcingQueue[existing]=item; else state.sourcingQueue.unshift(item);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({locked:true,profile:state.profile,business:state.business,sourcingQueue:state.sourcingQueue}))}catch(e){}
  state.selectedProduct=item;
  closeModal();
  toast("Product added to your sourcing queue");
  go("orders");
}

function sourcingKeywords(){
  const p=state.selectedProduct||opportunities()[0];
  const map={
    "Premium carry goods":["leather handbag","work bag organizer","travel organizer"],
    "Urban footwear":["casual loafer","urban sneaker","men shoes"],
    "Home fragrance":["scented candle","home diffuser","gift fragrance"],
    "Modern watches":["men watch","minimal watch","fashion watch"],
    "Everyday beauty":["personal care beauty","skincare daily care","beauty gift"],
    "Fitness essentials":["fitness accessories","gym accessories","workout gear"],
    "Private-label brand launch":["private label fashion product","premium lifestyle product","branded accessories"]
  };
  return (map[p?.name]||[String(p?.name||""),state.profile.skills||"fashion accessories"]).filter(Boolean).slice(0,3);
}

async function cjFetchKeyword(q){
  const url=CJ_PROXY+"?keyword="+encodeURIComponent(q)+"&page=1&size=12";
  const r=await fetch(url,{headers:{"apikey":"sb_publishable_RrciEiRwRPkbU6yO6wt8Zg_BI0tSYEW","Authorization":"Bearer sb_publishable_RrciEiRwRPkbU6yO6wt8Zg_BI0tSYEW"}});
  const j=await r.json();
  if(!r.ok||!j.ok) throw Error(j.error||"Supplier feed unavailable");
  return j;
}

async function cjAutoSource(){
  const box=document.getElementById("cjresults");
  if(!box)return;
  box.innerHTML="<div class='cj-empty cj-loading' style='grid-column:1/-1'><b>Forge is selecting products for you…</b><br><span class='small'>Checking live inventory and current prices against your locked business profile.</span></div>";
  try{
    const responses=await Promise.all(sourcingKeywords().map(cjFetchKeyword));
    const map=new Map();
    responses.forEach(j=>(j.products||[]).forEach(p=>{
      const price=Number(p.priceUsd);
      if(!p.id||!p.image||!p.name||!Number.isFinite(price)||price<=0)return;
      if(!map.has(p.id))map.set(p.id,p);
    }));
    cjState=[...map.values()].filter(p=>Number(p.inventory||0)>0||p.inventory==null).slice(0,6);
    cjLastFetched=new Date().toISOString();
    renderCjResults({total:cjState.length,fetchedAt:cjLastFetched,personalized:true});
  }catch(e){
    box.innerHTML="<div class='cj-empty' style='grid-column:1/-1'><b>Live product data is temporarily unavailable.</b><br><span class='small'>Forge will not invent products or prices. Please try again in a moment.</span></div>";
  }
}

function cjPanel(){
  const p=state.selectedProduct||opportunities()[0];
  return "<section class='cj-live'>"+
    "<div class='cj-head'><div><div class='eyebrow'>PERSONALIZED PRODUCT SOURCING</div><h2>Products selected for your business</h2><p class='small'>You do not need to search. Forge reads your locked profile, business model and risk capacity, then checks the connected supplier network and presents a curated shortlist.</p></div><div class='cj-live-note'><span class='pill online'>● LIVE PRICE CHECK</span><div class='small' style='margin-top:8px'>Current sourcing prices are refreshed from the connected supplier feed. Forge converts them into your planning currency.</div></div></div>"+
    "<div class='notice' style='margin-top:15px'><b>Why these products?</b><div class='small'>Selected for <b>"+esc(p?.name||"your recommended business")+"</b> using your capital, risk profile, market, time and business objective.</div></div>"+
    "<div class='cj-toolbar'><span id='cjmeta' class='cj-count'>Selecting live products…</span><span class='cj-count'>No invented prices</span></div>"+
    "<div id='cjresults' class='cj-results'><div class='cj-empty' style='grid-column:1/-1'>Preparing your personalized product shortlist…</div></div>"+
  "</section>";
}

const _forgeProducts=products;
products=function(){
  const html=_forgeProducts();
  setTimeout(cjAutoSource,80);
  return html+cjPanel();
};

function render(){let pages={home,advisor,ideas,products,plan,orders,brand,store,marketing,support,analytics};if(!state.profileLocked){document.getElementById("app").innerHTML=onboardingLanding();return}document.getElementById("app").innerHTML=shell(pages[state.page]())}
render();
</script>
