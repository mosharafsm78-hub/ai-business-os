name: Forge runtime patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch unlimited Brand Studio refresh
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          marker = "FORGE_UNLIMITED_BRAND_REFRESH_V2"
          if marker in s:
              print("Patch already installed.")
              raise SystemExit(0)

          patch = r'''
<!-- FORGE_UNLIMITED_BRAND_REFRESH_V2 -->
<script>
(function(){
  "use strict";
  const MARKER = "FORGE_UNLIMITED_BRAND_REFRESH_V2";
  const key = "forgeBrandRefreshCounter";
  const safe = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));

  function productBase(){
    const p = window.state && state.selectedProduct;
    const raw = p && (p.name || p.title) || (window.state && state.selectedOpportunityName) || "Product";
    return String(raw).replace(/[^a-zA-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  }

  function category(){
    const raw = (productBase()+" "+((window.state&&state.profile&&state.profile.category)||"")).toLowerCase();
    if (/bag|handbag|tote|shoulder/.test(raw)) return "bag";
    if (/shoe|sneaker|loafer|boot|sandal|footwear/.test(raw)) return "footwear";
    if (/watch/.test(raw)) return "watch";
    if (/beauty|cosmetic|skin|makeup/.test(raw)) return "beauty";
    if (/home|decor|frame|wall/.test(raw)) return "home";
    return "general";
  }

  const pools = {
    bag: [
      ["Avenue","Carry","Co.","", "Essential"],["Luma","Carry","", "Studio",""],["Morrow","Tote","", "House",""],
      ["Veya","Carry","", "Edit",""],["Arden","Bag","", "Works",""],["Nora","Carry","", "Collective",""],
      ["Cove","Carry","", "Supply",""],["Mira","Tote","", "Lab",""],["Velin","Carry","", "Goods",""],
      ["Aster","Carry","", "Atelier",""],["Rue","Bag","", "Company",""],["Sora","Carry","", "Daily",""]
    ],
    footwear: [
      ["Stride","Works","","",""],["Northline","Footwear","","",""],["Aven","Step","","Studio",""],["Crest","Footwear","","Co.",""],
      ["Morrow","Step","","",""],["Vanta","Footwear","","Lab",""],["Arden","Stride","","Works",""],["Lumen","Step","","House",""],
      ["Ridge","Footwear","","Collective",""],["Veya","Stride","","",""],["Cove","Footwear","","Edit",""],["Noble","Step","","Co.",""]
    ],
    watch: [
      ["Meridian","Time","","",""],["Aurex","Watch","","Co.",""],["North","Time","","Studio",""],["Veyra","Time","","Works",""],
      ["Morrow","Watch","","House",""],["Arden","Time","","Collective",""],["Crest","Time","","",""],["Luma","Watch","","Lab",""]
    ],
    beauty: [
      ["Veya","Beauty","","",""],["Luma","Skin","","Studio",""],["Aster","Beauty","","Co.",""],["Morrow","Care","","House",""],
      ["Nora","Beauty","","Lab",""],["Serein","Care","","Works",""],["Arden","Beauty","","Collective",""],["Velin","Skin","","Edit",""]
    ],
    home: [
      ["North","Living","","Co.",""],["Morrow","Home","","Studio",""],["Luma","Living","","Works",""],["Arden","House","","",""],
      ["Cove","Living","","Collective",""],["Veya","Home","","Lab",""],["Aster","Living","","Edit",""],["Nora","Home","","Co.",""]
    ],
    general: [
      ["Northstar","Goods","","",""],["Morrow","Supply","","Co.",""],["Veya","Works","","",""],["Arden","House","","",""],
      ["Luma","Collective","","",""],["Cove","Goods","","Studio",""],["Aster","Company","","",""],["Nora","Works","","Lab",""],
      ["Velin","Goods","","",""],["Mira","Supply","","House",""]
    ]
  };

  const productWords = [
    "Essential","Signature","Everyday","Core","Select","Edition","Classic","Prime","Daily","Form",
    "Heritage","Modern","Reserve","Original","Studio","One","Line","Craft","Urban","Refined",
    "Essential Plus","Signature Edit","Core Edition","Daily Select","Modern Classic","Prime Edit"
  ];

  function nextCounter(){
    const n = Number(localStorage.getItem(key) || "0") + 1;
    localStorage.setItem(key,String(n));
    if(window.state) state.nameRefreshCount = n;
    return n;
  }

  function makeBrandNames(n){
    const pool = pools[category()];
    const offset = (n-1) * 5;
    const out = [];
    for(let i=0;i<6;i++){
      const a = pool[(offset+i)%pool.length];
      const b = pool[(offset+i+3)%pool.length];
      const suffix = (n+i)%3===0 ? " & Co." : ((n+i)%3===1 ? " Studio" : " Goods");
      const name = (a[0]+" "+a[1]+(a[3] ? " "+a[3] : "")+suffix).replace(/\s+/g," ").trim();
      if(!out.includes(name)) out.push(name);
      const alt = (b[0]+" "+b[1]+" "+["Collective","Company","Atelier","House","Lab","Works"][(n+i)%6]).replace(/\s+/g," ").trim();
      if(!out.includes(alt)) out.push(alt);
    }
    return out.slice(0,6);
  }

  function makeProductNames(n){
    const base = productBase().split(" ").filter(Boolean).slice(0,3).join(" ");
    const out=[];
    for(let i=0;i<6;i++){
      const w = productWords[(n*7+i*3)%productWords.length];
      const style = [""," Studio"," Edit"," Collection"," Series"," Line"][(n+i)%6];
      const name = (base+" "+w+style).trim();
      if(!out.includes(name)) out.push(name);
    }
    return out;
  }

  function renderNameOptions(names){
    const host = document.querySelector(".brand-name-list");
    if(!host) return false;
    const selected = window.state && state.selectedProductName;
    host.innerHTML = names.map(name =>
      "<button class='brand-name-option "+(selected===name?"selected":"")+"' type='button' data-forge-name='"+safe(name)+"'>"+
      "<span>"+safe(name)+"</span><small>"+(selected===name?"Selected":"Use this product name →")+"</small></button>"
    ).join("");
    host.querySelectorAll("[data-forge-name]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(window.state){
          state.selectedProductName = btn.getAttribute("data-forge-name");
          try{ if(typeof persistProfile==="function") persistProfile(); }catch(e){}
        }
        renderNameOptions(names);
        if(typeof toast==="function") toast("Product name selected.");
      });
    });
    return true;
  }

  function refreshProductNames(){
    const n = nextCounter();
    const names = makeProductNames(n);
    if(!renderNameOptions(names)) return;
    const count = document.querySelector(".brand-suggestion-count");
    if(count) count.textContent = "Fresh product-name set · refresh "+n;
    const note = document.querySelector(".brand-refresh-note");
    if(note) note.textContent = "No refresh limit. Each click generates a new set. Keep refining until the name feels right.";
    try{ if(typeof persistProfile==="function") persistProfile(); }catch(e){}
    if(typeof toast==="function") toast("Fresh product names generated.");
  }

  function refreshDigital(){
    const n = nextCounter();
    const base = makeBrandNames(n);
    const primary = base[0].toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,18) || "yourbrand";
    const domain = primary+".com";
    const fb = "@"+primary;
    const cards = document.querySelectorAll(".brand-domain-grid");
    if(cards.length){
      const grid=cards[0];
      const html = grid.innerHTML;
      grid.innerHTML = html
        .replace(/(<div[^>]*>\s*<div class='label'>FACEBOOK<\/div>\s*<div[^>]*>)[\s\S]*?(<\/div>)/i,"$1"+safe(fb)+"$2")
        .replace(/(<div[^>]*>\s*<div class='label'>INSTAGRAM<\/div>\s*<div[^>]*>)[\s\S]*?(<\/div>)/i,"$1"+safe(fb)+"$2")
        .replace(/(<div[^>]*>\s*<div class='label'>SUGGESTED DOMAIN<\/div>\s*<div[^>]*>)[\s\S]*?(<\/div>)/i,"$1"+safe(domain)+"$2");
    }
    const note=document.querySelector(".brand-refresh-note");
    if(note) note.textContent="Fresh digital direction "+n+" generated. Availability must still be checked before registration.";
    if(typeof toast==="function") toast("Fresh digital identity direction generated.");
  }

  document.addEventListener("click", function(ev){
    const btn = ev.target.closest && ev.target.closest("button");
    if(!btn) return;
    const label=(btn.textContent||"").replace(/↻|→/g,"").trim().toLowerCase();
    if(label==="refresh product names"){
      ev.preventDefault(); ev.stopImmediatePropagation(); refreshProductNames(); return;
    }
    if(label==="refresh digital direction"){
      ev.preventDefault(); ev.stopImmediatePropagation(); refreshDigital(); return;
    }
  }, true);

  document.addEventListener("click", function(ev){
    const b=ev.target.closest && ev.target.closest("[data-forge-name]");
    if(!b) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
  }, true);
})();
</script>
'''
          needle = "</body>"
          if needle not in s:
              raise SystemExit("index.html has no closing body tag")
          s = s.replace(needle, patch + "\n" + needle, 1)
          p.write_text(s, encoding="utf-8")
          print("Installed unlimited Brand Studio refresh patch.")
      - name: Commit patch
        run: |
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix unlimited Brand Studio refresh actions"
          git push
